<script>
"use strict";
const $=id=>document.getElementById(id);
const $$=s=>[].slice.call(document.querySelectorAll(s));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* ══════════ 模型（与原版逐项一致） ══════════
   ∂u/∂t = Dᵤ∇²u − uv² + F(1−u)
   ∂v/∂t = Dᵥ∇²v + uv² − (F+k)v
   显式 Euler · Karl Sims 的 3×3 拉普拉斯（权重和为 0）· 环形边界
*/
const N=240, SIZE=N*N, DU=1, DV=.5, DT=1;
const PRESETS={
  mitosis:{name:"分裂斑点",f:.0367,k:.0649},
  spots:{name:"斑点群",f:.025,k:.06},
  worms:{name:"蠕虫",f:.055,k:.062},
  maze:{name:"迷宫",f:.029,k:.057}
};
let u=new Float32Array(SIZE),v=new Float32Array(SIZE);
let uN=new Float32Array(SIZE),vN=new Float32Array(SIZE);
let feed=.0367,kill=.0649,steps=0,running=true;
let tool="add",presetKey="mitosis",selected={x:N>>1,y:N>>1},pointerDown=false;
let stepsPerFrame=5;

const idx=(x,y)=>(((y%N)+N)%N)*N+(((x%N)+N)%N);
function lap(a,x,y){
  return -a[idx(x,y)]
    +.2*(a[idx(x-1,y)]+a[idx(x+1,y)]+a[idx(x,y-1)]+a[idx(x,y+1)])
    +.05*(a[idx(x-1,y-1)]+a[idx(x+1,y-1)]+a[idx(x-1,y+1)]+a[idx(x+1,y+1)]);
}
/* 与 lap() 逐项等价，但把行偏移提到内层循环外、用分支代替取模。
   热点每格原本要算 18 次模，改写后为 0 次。数值结果完全相同。 */
function advanceOne(){
  const kd=feed+kill;
  for(let y=0;y<N;y++){
    const ym=(y===0?N-1:y-1)*N, y0=y*N, yp=(y===N-1?0:y+1)*N;
    for(let x=0;x<N;x++){
      const xm=x===0?N-1:x-1, xp=x===N-1?0:x+1;
      const i=y0+x, a=u[i], b=v[i];
      const lu=-a+.2*(u[y0+xm]+u[y0+xp]+u[ym+x]+u[yp+x])
               +.05*(u[ym+xm]+u[ym+xp]+u[yp+xm]+u[yp+xp]);
      const lv=-b+.2*(v[y0+xm]+v[y0+xp]+v[ym+x]+v[yp+x])
               +.05*(v[ym+xm]+v[ym+xp]+v[yp+xm]+v[yp+xp]);
      const rxn=a*b*b;
      uN[i]=clamp(a+(DU*lu-rxn+feed*(1-a))*DT,0,1);
      vN[i]=clamp(b+(DV*lv+rxn-kd*b)*DT,0,1);
    }
  }
  const tu=u;u=uN;uN=tu;
  const tv=v;v=vN;vN=tv;
  steps++;
}
function stampSquare(cx,cy,side,uu,vv){
  const h=side/2;
  for(let y=Math.round(cy-h);y<Math.round(cy-h)+side;y++)
    for(let x=Math.round(cx-h);x<Math.round(cx-h)+side;x++){
      const i=idx(x,y);u[i]=uu;v[i]=vv;
    }
}
function stampDisc(cx,cy,r,mode){
  const R=Math.max(1,r);
  for(let oy=-R;oy<=R;oy++)for(let ox=-R;ox<=R;ox++){
    if(ox*ox+oy*oy>R*R)continue;
    const i=idx(cx+ox,cy+oy);
    if(mode==="erase"){u[i]=1;v[i]=0;}else{u[i]=.5;v[i]=.25;}
  }
}
function makeUniform(){u.fill(1);v.fill(0);uN.fill(1);vN.fill(0);steps=0;}
function lcg(s){let t=s>>>0;return()=>((t=Math.imul(1664525,t)+1013904223>>>0)/4294967296);}
let seedId=0;
function scatter(){
  makeUniform();
  const rnd=lcg(0x9e3779b9+seedId);
  for(let j=0;j<7;j++)
    stampDisc(18+Math.floor(rnd()*(N-36)),18+Math.floor(rnd()*(N-36)),3+Math.floor(rnd()*3),"add");
}
function termData(x,y){
  const i=idx(x,y),a=u[i],b=v[i],rxn=a*b*b;
  const uDiff=DU*lap(u,x,y),uReact=-rxn,uFeed=feed*(1-a);
  const vDiff=DV*lap(v,x,y),vReact=rxn,vKill=-(feed+kill)*b;
  return{a,b,uDiff,uReact,uFeed,uSum:uDiff+uReact+uFeed,
         vDiff,vReact,vKill,vSum:vDiff+vReact+vKill};
}

/* ══════════ 渲染：整屏铺开 ══════════ */
const cv=$("field"),cx=cv.getContext("2d",{alpha:false});
const off=document.createElement("canvas");off.width=N;off.height=N;
const octx=off.getContext("2d",{alpha:false});
const img=octx.createImageData(N,N);
function render(){
  const d=img.data;
  for(let i=0;i<SIZE;i++){
    const t=Math.pow(clamp(v[i]/.4,0,1),.72),p=i<<2;
    /* 暗底 → 橙 → 亮：低 V 接近页面底色，高 V 发亮 */
    d[p]  =Math.round(11+(255-11)*Math.pow(t,.85));
    d[p+1]=Math.round(13+(150-13)*Math.pow(t,1.5));
    d[p+2]=Math.round(17+(86-17)*Math.pow(t,2.2));
    d[p+3]=255;
  }
  octx.putImageData(img,0,0);
  /* 场是柔和的连续量，背景分辨率不需要满 dpr；
     整屏放大的填充成本远高于模拟本身，降到 1.25 可换来更密的网格 */
  const dpr=Math.min(1.25,devicePixelRatio||1);
  const w=Math.round(innerWidth*dpr),h=Math.round(innerHeight*dpr);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  cx.setTransform(1,0,0,1,0,0);
  cx.imageSmoothingEnabled=true;
  /* 用 cover 方式铺满，保持正方形不拉伸 */
  const s=Math.max(w/N,h/N);
  const dw=N*s,dh=N*s;
  cx.fillStyle="#0b0d11";cx.fillRect(0,0,w,h);
  cx.drawImage(off,(w-dw)/2,(h-dh)/2,dw,dh);
  if(tool==="inspect"){
    const px=(w-dw)/2+(selected.x+.5)*s, py=(h-dh)/2+(selected.y+.5)*s;
    cx.strokeStyle="#ffd166";cx.lineWidth=2.4*dpr;
    cx.strokeRect(px-4*dpr*2,py-4*dpr*2,16*dpr,16*dpr);
    cx.beginPath();cx.arc(px,py,26*dpr,0,7);
    cx.strokeStyle="rgba(255,209,102,.35)";cx.lineWidth=dpr;cx.stroke();
  }
}
function screenToCell(ev){
  const dpr=Math.min(1.25,devicePixelRatio||1);
  const w=cv.width,h=cv.height;
  const s=Math.max(w/N,h/N),dw=N*s,dh=N*s;
  const r=cv.getBoundingClientRect();
  const px=(ev.clientX-r.left)*dpr, py=(ev.clientY-r.top)*dpr;
  return{x:Math.floor((px-(w-dw)/2)/s), y:Math.floor((py-(h-dh)/2)/s)};
}

/* ══════════ HUD ══════════ */
let mAcc=0;
function hud(){
  let sum=0,act=0;
  for(let i=0;i<SIZE;i++){sum+=v[i];if(v[i]>.05)act++;}
  $("mSteps").textContent=steps.toLocaleString("zh-CN");
  $("mMean").textContent=(sum/SIZE).toFixed(3);
  $("mActive").textContent=(100*act/SIZE).toFixed(1)+"%";
  $("mFk").textContent=feed.toFixed(4)+" / "+kill.toFixed(4);
  return 100*act/SIZE;
}

/* ══════════ 逐格检查面板 ══════════ */
function drawInspect(){
  if(tool!=="inspect"){$("inspect").classList.remove("show");return;}
  $("inspect").classList.add("show");
  const t=termData(selected.x,selected.y);
  const row=(label,val)=>{
    const w=Math.min(50,Math.abs(val)/.16*50);
    return `<div class="trow"><span>${label}</span>
      <div class="tbar"><i class="${val<0?"neg":""}" style="${val<0?`right:50%;width:${w}%`:`left:50%;width:${w}%`}"></i></div>
      <b>${(val>=0?"+":"")+val.toFixed(5)}</b></div>`;
  };
  $("insBody").innerHTML=
    `<div class="trow"><span>坐标</span><div></div><b>${selected.x}, ${selected.y}</b></div>
     <div class="trow"><span>U 浓度</span><div></div><b>${t.a.toFixed(4)}</b></div>
     <div class="trow"><span>V 浓度</span><div></div><b>${t.b.toFixed(4)}</b></div>
     <div style="height:9px"></div>
     ${row("U 扩散",t.uDiff)}${row("U 被反应吃掉",t.uReact)}${row("U 被补给",t.uFeed)}
     <div class="tsum">${row("U 净变化",t.uSum)}</div>
     <div style="height:9px"></div>
     ${row("V 扩散",t.vDiff)}${row("V 由反应生成",t.vReact)}${row("V 被清除",t.vKill)}
     <div class="tsum">${row("V 净变化",t.vSum)}</div>`;
}

/* ══════════ 阈值实验 ══════════ */
const TH={side:6,amp:.25,running:false,t0:0,target:2600};
function dropBlob(){
  makeUniform();
  stampSquare(N>>1,N>>1,TH.side,.5,TH.amp);
  TH.running=true;TH.t0=steps;
  running=true;stepsPerFrame=8;
  say("投放完成，正在演化……","");
}
function thresholdWatch(){
  if(!TH.running)return;
  if(steps-TH.t0<TH.target)return;
  TH.running=false;stepsPerFrame=4;
  const a=hud();
  if(a<0.05)say(`<b>湮灭。</b>边长 ${TH.side}、强度 ${TH.amp.toFixed(2)} 的扰动完全消失，场回到 u=1、v=0。活跃格 ${a.toFixed(2)}%。`,"dead");
  else say(`<b>存活。</b>边长 ${TH.side}、强度 ${TH.amp.toFixed(2)} 的扰动活了下来并开始扩张。活跃格 ${a.toFixed(2)}%。`,"live");
}
function say(html,cls){const e=$("verdict");e.innerHTML=html;e.className=cls||"";}

/* ══════════ 章节 ══════════ */
const CTRL_MAIN=`
  <div class="knob"><div class="knob-head"><label for="sF">供给率 F</label><b id="vF"></b></div>
    <input type="range" id="sF" min="0.015" max="0.065" step="0.0001"></div>
  <div class="knob"><div class="knob-head"><label for="sK">清除率 k</label><b id="vK"></b></div>
    <input type="range" id="sK" min="0.05" max="0.07" step="0.0001"></div>
  <div class="btns">
    <button class="btn" data-preset="mitosis">分裂斑点</button>
    <button class="btn" data-preset="spots">斑点群</button>
    <button class="btn" data-preset="worms">蠕虫</button>
    <button class="btn" data-preset="maze">迷宫</button>
  </div>
  <div class="sep"></div>
  <div class="btns">
    <button class="btn" id="b_run">暂停</button>
    <button class="btn" id="b_tool">检查格点</button>
    <button class="btn wide" id="b_scatter">换一组随机扰动</button>
    <button class="btn wide" id="b_clear">恢复均匀场</button>
  </div>`;
const CTRL_TH=`
  <div class="knob"><div class="knob-head"><label for="sSide">扰动边长（格）</label><b id="vSide"></b></div>
    <input type="range" id="sSide" min="1" max="24" step="1"></div>
  <div class="knob"><div class="knob-head"><label for="sAmp">扰动强度 V</label><b id="vAmp"></b></div>
    <input type="range" id="sAmp" min="0.05" max="0.5" step="0.01"></div>
  <div class="btns">
    <button class="btn key wide" id="b_drop">投放并运行 2600 步</button>
    <button class="btn" id="b_dec">边长 −1</button>
    <button class="btn" id="b_inc">边长 +1</button>
  </div>`;

const CH=[
{t:"什么也不会发生",
 c:CTRL_MAIN,
 b:`<p>屏幕上铺满的是一块<b>完全均匀</b>的化学场：处处 U = 1、V = 0。</p>
    <p>把这两个数代回方程，六项——两个扩散、两个反应、补给、清除——<em>全部为零</em>。</p>
    <span class="fml">∂u/∂t = Dᵤ∇²u − uv² + F(1−u)
∂v/∂t = Dᵥ∇²v + uv² − (F+k)v</span>
    <p>所以这是一个<b>精确稳态</b>。它不是"暂时看不出变化"，是数学上一动不动。你可以一直等下去，什么都不会长出来。</p>
    <p class="q">下面的步数在涨，平均 V 始终是 0.000。</p>`,
 en(){makeUniform();running=true;stepsPerFrame=4;tool="add";
      say("场是均匀的。步数在涨，平均 V 恒为 0。","");}},

{t:"一次足够大的搅动",
 c:CTRL_MAIN,
 b:`<p>现在往中央投一块 20 格见方的扰动：把那里的 U 压到 0.5、V 抬到 0.25。</p>
    <p>没有剧本。接下来发生的一切，都只是同一套方程在每个格点上反复执行。</p>
    <p>它先鼓起来，然后<b>分裂</b>，再分裂，一直铺满整块场。</p>
    <p><em>你可以直接在画布上拖动</em>，在任何地方补一笔 V，看它怎么被卷进这个过程。</p>
    <p class="q">U 是被持续补给的原料，V 会参与自我复制（反应 U + 2V → 3V）同时被清除。非线性项 uv² 让 V 越多的地方反应越快，而 U 扩散得更快，会从周围补进来。</p>`,
 en(){makeUniform();stampSquare(N>>1,N>>1,20,.5,.25);
      running=true;stepsPerFrame=6;tool="add";
      say("中央 20² 扰动（u 0.5 · v 0.25）。拖动画布可以再补 V。","");}},

{t:"门槛只差一个像素",
 c:CTRL_TH,
 b:`<p>上一章那块扰动是 20 格。如果小一点呢？</p>
    <p>这不是"小一点就慢一点"的问题。<b>存在一个门槛</b>：低于它，扰动会被完全抹平，场精确地回到 U = 1、V = 0；高于它，同一套方程就会把它推向铺满全场。</p>
    <p>右边把边长调到 <b>5</b>，投放。再调到 <b>6</b>，投放。</p>
    <p>同样的方程，同样的参数，同样的位置——<em>差一格</em>。</p>
    <span class="fml">边长 ≤ 5　→　活跃格 0.00 %
边长 ≥ 6　→　存活并扩张</span>
    <p>强度那一轴也一样：边长固定 20 时，V ≤ 0.20 湮灭，V ≥ 0.25 存活。</p>
    <p class="q">这就是为什么这个系统不能靠"数值噪声"启动。它需要的是<b>有限振幅</b>扰动——Pearson 1993 年那篇论文强调的正是这一点，而它跟图灵不稳定性是两种不同的机制：这里的均匀态对<em>所有</em>波长都是线性稳定的。</p>`,
 en(){TH.running=false;makeUniform();running=false;stepsPerFrame=8;tool="add";
      say("设好边长与强度，然后按「投放并运行」。建议先试 5，再试 6。","");}},

{t:"一格只知道八个邻居",
 c:CTRL_MAIN,
 b:`<p>"斑点""蠕虫""迷宫"——这些词在方程里<b>一个都不存在</b>。</p>
    <p>右侧切到<b>检查格点</b>，然后点画面上任意位置。右下角会把这一格的下一步拆成六项：扩散、反应、补给、清除，各贡献多少。</p>
    <p>橙色向右是增加，蓝色向左是减少。它们相加就是这一格下一刻的变化量。</p>
    <p>点在斑点中心、边缘、和空白处各试一次——同一套项，权重完全不同。</p>

 en(){if(steps<400){makeUniform();stampSquare(N>>1,N>>1,20,.5,.25);}
      running=true;stepsPerFrame=4;tool="inspect";
      selected={x:N>>1,y:N>>1};
      say("点击画面任意位置，右下角展开那一格的六项。","");}},

{t:"同一条方程，不只一种世界",
 c:CTRL_MAIN,
 b:`<p>F 决定 U 补得多快，k 决定 V 除得多快。方程一个字都不改，只动这两个数。</p>
    <p>拖动它们，或者直接点四个预设。每次换参数都会重置成中央扰动，从同一个起点长起。</p>
    <ul>
      <li><b>分裂斑点</b> F .0367 · k .0649</li>
      <li><b>斑点群</b> F .025 · k .060</li>
      <li><b>蠕虫</b> F .055 · k .062</li>
      <li><b>迷宫</b> F .029 · k .057</li>
    </ul>
    <p class="q">形态名只是对有限时间、有限网格上的方便描述。初始扰动、边界、离散方法和运行步数都会影响细节——所以每次比较都要把这些条件一并记下。本文固定 Dᵤ=1、Dᵥ=0.5、Δt=1、${N}² 网格、环形边界。</p>`,
 en(){running=true;stepsPerFrame=5;tool="add";
      say("换参数会从同一个中央扰动重新长起，便于对照。","");}},

{t:"整体形状，可以没有整体设计者",
 c:CTRL_MAIN,
 b:`<p>值得记住的不是某一张花纹，而是<b>解释的尺度</b>：</p>
    <p>格点上只有扩散、反应、补给、清除四件事，每一件都只看自己和八个邻居。斑点分裂、边界推进、迷宫成形——这些是我们在<em>更高尺度</em>上才看见的东西。</p>
    <p>而这一切要开始，需要的不是一个设计者，只是<b>一次足够大的搅动</b>。</p>
    <p class="q">解释边界：Gray–Scott 是一个数学化学模型。它证明简单局部反应能够生成复杂空间结构；它本身<em>不证明</em>某只豹子、某片珊瑚或某个细胞一定采用了这套化学反应。</p>
    <p class="q">来源：Pearson, <i>Complex patterns in a simple system</i>, Science 261 (1993)；Karl Sims 的反应扩散教程（方程、扩散常数与 3×3 拉普拉斯权重）。</p>`,
 en(){running=true;stepsPerFrame=6;tool="add";
      say("拖动画布还可以继续加 V。","");}}
];

/* ══════════ 章节机制 ══════════ */
let si=-1;
function gotoStep(i){
  i=clamp(i,0,CH.length-1);
  const ch=CH[i], changed=(si<0)||(CH[si].c!==ch.c);
  si=i;
  $("stepno").textContent=String(i+1).padStart(2,"0")+" / "+String(CH.length).padStart(2,"0");
  $("sttitle").textContent=ch.t;
  $("stbody").innerHTML=ch.b;
  $("stbody").scrollTop=0;
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
  $("prev").disabled=i===0;$("next").disabled=i===CH.length-1;
  if(changed){$("ctrlbody").innerHTML=ch.c;bindCtrl();}
  ch.en();
  syncCtrl();
}
function bindCtrl(){
  const sF=$("sF");
  if(sF){
    sF.value=feed;$("sK").value=kill;
    sF.oninput=()=>{feed=+sF.value;resetPattern();syncCtrl();};
    $("sK").oninput=()=>{kill=+$("sK").value;resetPattern();syncCtrl();};
    $$("[data-preset]").forEach(b=>b.onclick=()=>{
      const p=PRESETS[b.dataset.preset];presetKey=b.dataset.preset;
      feed=p.f;kill=p.k;$("sF").value=p.f;$("sK").value=p.k;
      resetPattern();syncCtrl();
      say(`<b>${p.name}</b>　F ${p.f.toFixed(4)} · k ${p.k.toFixed(4)}`,"");
    });
    $("b_run").onclick=()=>{running=!running;syncCtrl();};
    $("b_tool").onclick=()=>{tool=tool==="inspect"?"add":"inspect";syncCtrl();drawInspect();};
    $("b_scatter").onclick=()=>{seedId++;scatter();say("新扰动 · 种子 "+seedId,"");};
    $("b_clear").onclick=()=>{makeUniform();say("已恢复均匀场：U = 1、V = 0。什么也不会发生。","");};
  }
  const sS=$("sSide");
  if(sS){
    sS.value=TH.side;$("sAmp").value=TH.amp;
    sS.oninput=()=>{TH.side=+sS.value;syncCtrl();};
    $("sAmp").oninput=()=>{TH.amp=+$("sAmp").value;syncCtrl();};
    $("b_drop").onclick=dropBlob;
    $("b_dec").onclick=()=>{TH.side=clamp(TH.side-1,1,24);$("sSide").value=TH.side;syncCtrl();dropBlob();};
    $("b_inc").onclick=()=>{TH.side=clamp(TH.side+1,1,24);$("sSide").value=TH.side;syncCtrl();dropBlob();};
  }
}
function resetPattern(){
  makeUniform();stampSquare(N>>1,N>>1,20,.5,.25);
}
function syncCtrl(){
  if($("vF")){$("vF").textContent=feed.toFixed(4);$("vK").textContent=kill.toFixed(4);}
  if($("vSide")){$("vSide").textContent=TH.side+" 格";$("vAmp").textContent=TH.amp.toFixed(2);}
  const r=$("b_run");if(r){r.textContent=running?"暂停":"继续";r.classList.toggle("on",running);}
  const t=$("b_tool");if(t){t.textContent=tool==="inspect"?"检查中":"检查格点";t.classList.toggle("on",tool==="inspect");}
  $$("[data-preset]").forEach(b=>b.classList.toggle("on",b.dataset.preset===presetKey));
}

/* ══════════ 交互 ══════════ */
cv.addEventListener("pointerdown",e=>{
  pointerDown=true;cv.setPointerCapture(e.pointerId);handlePointer(e);
});
cv.addEventListener("pointermove",e=>{if(pointerDown)handlePointer(e);});
addEventListener("pointerup",()=>{pointerDown=false;});
function handlePointer(e){
  const c=screenToCell(e);
  if(c.x<0||c.y<0||c.x>=N||c.y>=N)return;
  if(tool==="inspect"){selected={x:c.x,y:c.y};drawInspect();}
  else stampDisc(c.x,c.y,4,tool);
}
$("prev").onclick=()=>gotoStep(si-1);
$("next").onclick=()=>gotoStep(si+1);
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")gotoStep(si-1);
  if(e.key==="ArrowRight")gotoStep(si+1);
  if(e.key===" "){e.preventDefault();running=!running;syncCtrl();}
});
$$("#switch button").forEach(b=>b.onclick=()=>{
  document.body.className="panelmode-"+b.dataset.panel;
  $$("#switch button").forEach(x=>x.classList.toggle("on",x===b));
});

/* ══════════ 主循环 ══════════ */
let acc=0;
function frame(){
  if(running)for(let k=0;k<stepsPerFrame;k++)advanceOne();
  render();
  if(++acc%12===0){hud();drawInspect();}
  thresholdWatch();
  requestAnimationFrame(frame);
}

/* ══════════ 启动 ══════════ */
$("dots").innerHTML=CH.map(()=>"<i></i>").join("");
$$("#dots i").forEach((d,k)=>d.onclick=()=>gotoStep(k));
document.body.className="panelmode-story";
gotoStep(0);
hud();
requestAnimationFrame(frame);
setTimeout(()=>{$("loader").classList.add("hide");
  setTimeout(()=>$("loader").style.display="none",600);},260);

/* ══════════ 页面自检：只做瞬时不变量 ══════════
   阈值那类需要数千步的验证放在 tests/reaction-diffusion-model.mjs，
   由 npm run deploy 的门禁执行，不拖慢页面加载。 */
window.__rdCheck=(()=>{
  const su=u.slice(),sv=v.slice(),ss=steps;
  makeUniform();
  for(let i=0;i<60;i++)advanceOne();
  let mx=0;
  for(let i=0;i<SIZE;i++){
    const du=Math.abs(u[i]-1),dv=Math.abs(v[i]);
    if(du>mx)mx=du; if(dv>mx)mx=dv;
  }
  u=su;v=sv;steps=ss;
  return{均匀态最大偏离:mx,拉普拉斯权重和:-1+4*.2+4*.05,网格:N};
})();
if(window.__rdCheck.均匀态最大偏离>1e-9)
  console.warn("[rd] 均匀态不是精确稳态：",window.__rdCheck.均匀态最大偏离);
if(Math.abs(window.__rdCheck.拉普拉斯权重和)>1e-12)
  console.warn("[rd] 拉普拉斯权重和不为 0");
</script>
