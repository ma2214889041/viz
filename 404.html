<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f3ef">
<link rel="icon" href="/favicon.png" type="image/png">
<title>没有找到这个页面 — VIZ</title>
<style>
:root{--paper:#f4f3ef;--ink:#171715;--blue:#315cff;--line:#d4d2ca;--serif:"Songti SC","Noto Serif SC",Georgia,serif;--sans:"PingFang SC","Noto Sans SC",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--paper);color:var(--ink);font-family:var(--sans);display:grid;grid-template-rows:72px 1fr}
header{border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.06em;text-decoration:none;display:flex;gap:9px;align-items:center}
.mark{width:11px;height:11px;border-radius:50%;background:var(--ink);box-shadow:8px 0 0 var(--blue)}
main{display:grid;grid-template-columns:1fr 1fr;min-height:0}
.copy{padding:9vw 5vw;display:flex;flex-direction:column;justify-content:center}
.code{font:11px ui-monospace,monospace;letter-spacing:.14em;margin-bottom:28px}
h1{font:500 clamp(52px,8vw,118px)/.98 var(--serif);letter-spacing:-.055em}
h1 span{display:block;color:var(--blue)}
p{max-width:520px;margin-top:30px;line-height:1.8;color:#64635d}
.go{display:inline-flex;width:max-content;margin-top:34px;padding:14px 18px;background:var(--ink);color:white;text-decoration:none;font-size:13px}
.field{background:var(--ink);position:relative;overflow:hidden}
.field::before,.field::after{content:"";position:absolute;left:50%;top:50%;border:1px solid rgba(114,217,238,.26);border-radius:50%;transform:translate(-50%,-50%)}
.field::before{width:46%;aspect-ratio:1}.field::after{width:72%;aspect-ratio:1}
.dot{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:#72d9ee;transform:translate(-50%,-50%);box-shadow:0 0 40px 18px rgba(49,92,255,.28)}
@media(max-width:700px){body{grid-template-rows:62px 1fr}main{grid-template-columns:1fr}.field{min-height:38vh}.copy{padding:64px 24px}}
</style>
</head>
<body>
<header><a class="logo" href="/"><span class="mark"></span>VIZ</a></header>
<main>
  <section class="copy">
    <div class="code">404 / OUTSIDE THE MAP</div>
    <h1>这里还没有<span>可视化。</span></h1>
    <p>这个地址不存在，或者作品已经移动。回到 VIZ，继续探索数学、物理、数据与系统里的复杂问题。</p>
    <a class="go" href="/">返回全部作品&nbsp;&nbsp;→</a>
  </section>
  <div class="field" aria-hidden="true"><span class="dot"></span></div>
</main>
</body>
</html>
