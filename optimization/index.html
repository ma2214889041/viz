<meta name="description" content="梯度为零不等于最优。鞍点在一个方向向上、另一个方向向下；而维数越高，鞍点越是压倒性地多——10 万个随机 6×6 对称矩阵里，正定的一个都没有。">

<style>

  --bg:#080a0e; --ink:#f2f4f8; --dim:#98a0b2; --dim2:#5b6376;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;

button,input{font:inherit;color:inherit}

:where(a,button,input):focus-visible{outline:2px solid var(--ball);outline-offset:2px}

#land{position:fixed;inset:0;width:100%;height:100%;display:block;

#land:active{cursor:grabbing}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;

#top{position:fixed;top:0;left:0;right:0;height:54px;z-index:20;display:flex;

#where{font-size:12px;color:var(--dim2)}
#back{margin-left:auto;pointer-events:auto;font-size:12.5px;color:var(--dim);

#verdict.min{background:rgba(79,209,165,.13);color:#b6ead8}

#hud{position:fixed;left:18px;bottom:16px;z-index:20;display:flex;
  background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);

.hcell:last-child{border-right:0}

.hcell.g b{color:var(--ball)} .hcell.n b{color:var(--up)} .hcell.p b{color:var(--ok)}

#chart.show{display:block}

@media(max-width:900px){
  #story{left:10px;right:10px;top:60px;width:auto;max-height:42vh;padding:16px 16px 12px}

  #ctrl{left:10px;right:10px;width:auto;top:calc(42vh + 68px);max-height:44vh;overflow-y:auto}

  body.pm-story #ctrl{display:none}

}
@media(min-width:901px){#switch{display:none}}

<body>

<canvas id="land" aria-label="损失地形与优化轨迹"></canvas>
<div id="vig"></div>

<div id="top">

  <span id="where">优化 × 可探索论文</span>
  <a id="back" href="../">全部文章 ↗</a>
</div>

<div id="switch">
  <button type="button" data-panel="story" class="on">讲解</button>
  <button type="button" data-panel="ctrl">参数</button>
</div>

<section class="panel" id="story" aria-live="polite">
  <div id="stepno"></div>
  <h1 id="sttitle"></h1>
  <div id="stbody"></div>
  <div id="nav">
    <div id="dots"></div>
    <button class="navb" id="prev" aria-label="上一章">‹</button>

  </div>
</section>

  <h4>控 制</h4>
  <div id="ctrlbody"></div>

</section>

<div id="hud">
  <div class="hcell g"><span>梯度大小 |∇f|</span><b id="mG">—</b></div>
  <div class="hcell"><span>当前损失 f</span><b id="mF">—</b></div>
  <div class="hcell n"><span>曲率 ∂²f/∂x²</span><b id="mH1">—</b></div>
  <div class="hcell p"><span>曲率 ∂²f/∂y²</span><b id="mH2">—</b></div>
</div>

<section class="panel" id="chart">
  <h5 id="chTitle">随机对称矩阵中「全部特征值为正」的比例</h5>
  <canvas id="cv2"></canvas>
  <div class="cap" id="chCap"></div>
</section>

<div id="hint">拖动旋转地形 · 滚轮缩放 · ← → 翻章</div>
<div id="loader"><div>正在生成损失地形…</div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const $$=s=>[].slice.call(document.querySelectorAll(s));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* ══════════ 地形 ══════════
   一个单参数族就够覆盖全部章节，而且所有临界点与特征值都能精确写出：

     f(x,y) = x⁴/4 − κx²/2 + y²/2 + t·x
     ∇f     = (x³ − κx + t,  y)
     H      = diag(3x² − κ,  1)

   κ < 0：单个凸碗
   κ > 0：原点成为鞍点（H = diag(−κ, 1)，一正一负），两侧各有一个极小
   t ≠ 0：两个极小深浅不同 → 局部最优与全局最优
*/
const S={kappa:-1.5,t:0,alpha:.06,mom:0,x:1.6,y:1.2,vx:0,vy:0,
  running:false,traj:[],dim:1};
const fAt=(x,y)=>x*x*x*x/4-S.kappa*x*x/2+y*y/2+S.t*x;
const gAt=(x,y)=>[x*x*x-S.kappa*x+S.t, y];
const hAt=x=>[3*x*x-S.kappa, 1];

function resetBall(x,y){
  S.x=x;S.y=y;S.vx=0;S.vy=0;S.traj=[[x,y]];S.running=true;
}
function stepBall(){
  const g=gAt(S.x,S.y);
  S.vx=S.mom*S.vx-S.alpha*g[0];
  S.vy=S.mom*S.vy-S.alpha*g[1];
  S.x=clamp(S.x+S.vx,-3.4,3.4);
  S.y=clamp(S.y+S.vy,-2.8,2.8);
  S.traj.push([S.x,S.y]);
  if(S.traj.length>900)S.traj.shift();
  if(Math.hypot(g[0],g[1])<2e-4&&Math.hypot(S.vx,S.vy)<2e-4)S.running=false;
}
/* 精确临界点：y=0，x³ − κx + t = 0 */
function criticals(){
  const out=[],k=S.kappa,t=S.t;
  const g=x=>x*x*x-k*x+t;
  let prev=g(-3);
  for(let s=-3;s<3;s+=.002){
    const cur=g(s+.002);
    if(prev===0||prev*cur<0){
      let a=s,b=s+.002;
      for(let i=0;i<70;i++){const m=(a+b)/2;(g(a)*g(m)<=0)?b=m:a=m;}
      const x=(a+b)/2;
      if(!out.some(q=>Math.abs(q.x-x)<1e-3))
        out.push({x,ev:hAt(x),f:fAt(x,0)});
    }
    prev=cur;
  }
  return out;
}

/* ══════════ 三维地形渲染 ══════════ */
const cv=$("land"),cx=cv.getContext("2d");
const CAM={az:-.62,el:.52,dist:1,taz:-.62,tel:.52,tdist:1};
let W=0,H=0,DPR=1,CENX=0,CENY=0;
const GX=52, RX=2.7, RY=2.1;
function fit(){
  DPR=Math.min(1.7,devicePixelRatio||1);
  const w=Math.round(innerWidth*DPR),h=Math.round(innerHeight*DPR);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  W=w;H=h;cx.setTransform(1,0,0,1,0,0);
}
/* 视野中心避开两侧面板 */
function centerXY(){
  if(innerWidth<901)return[innerWidth/2,innerHeight*.70];
  const st=$("story").getBoundingClientRect(),ct=$("ctrl").getBoundingClientRect();
  return[(st.right+ct.left)/2,innerHeight*.56];
}
const ZS=.62;                       /* 高度缩放 */
const zOf=(x,y)=>-fAt(x,y)*ZS;      /* 屏幕上「低」= 损失小，所以取负 */
function proj(x,y,z){
  const ca=Math.cos(CAM.az),sa=Math.sin(CAM.az);
  const ce=Math.cos(CAM.el),se=Math.sin(CAM.el);
  const X=x*ca-y*sa,Y=x*sa+y*ca;
  const sc=Math.min(W,H)*.108*CAM.dist;
  const sx=X,sy=Y*ce+z*se,depth=Y*se-z*ce;
  const pp=1/(1+depth*.04);
  return[CENX+sx*sc*pp, CENY-sy*sc*pp, depth];
}
/* 地形配色：谷深 → 蓝，脊高 → 暖 */
function terrainColor(f,shade){
  const t=clamp((f+1.8)/4.2,0,1);
  const r=Math.round((46+180*t*t)*shade);
  const g=Math.round((70+96*t)*shade);
  const b=Math.round((128-46*t)*shade);
  return`rgb(${r},${g},${b})`;
}
function drawLand(){
  const bx=i=>-RX+2*RX*i/GX, by=j=>-RY+2*RY*j/GX;
  const sa=Math.sin(CAM.az),ca=Math.cos(CAM.az),se=Math.sin(CAM.el);
  const cells=[];
  for(let j=0;j<GX;j++)for(let i=0;i<GX;i++){
    const x=bx(i+.5),y=by(j+.5);
    cells.push([i,j,(x*sa+y*ca)*se-zOf(x,y)*Math.cos(CAM.el)]);
  }
  cells.sort((p,q)=>q[2]-p[2]);
  const LX=.42,LY=-.34,LZ=.84;      /* 光照方向 */
  for(const c of cells){
    const i=c[0],j=c[1];
    const x0=bx(i),x1=bx(i+1),y0=by(j),y1=by(j+1);
    const z00=zOf(x0,y0),z10=zOf(x1,y0),z01=zOf(x0,y1),z11=zOf(x1,y1);
    const p00=proj(x0,y0,z00),p10=proj(x1,y0,z10),p11=proj(x1,y1,z11),p01=proj(x0,y1,z01);
    const ax=x1-x0,az=z10-z00,cy2=y1-y0,cz2=z01-z00;
    let nx=-az*cy2,ny=-ax*cz2,nz=ax*cy2;
    const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
    const lam=clamp(nx*LX+ny*LY+nz*LZ,0,1);
    const shade=.34+.66*lam;
    cx.fillStyle=terrainColor(fAt((x0+x1)/2,(y0+y1)/2),shade);
    cx.beginPath();cx.moveTo(p00[0],p00[1]);cx.lineTo(p10[0],p10[1]);
    cx.lineTo(p11[0],p11[1]);cx.lineTo(p01[0],p01[1]);cx.closePath();cx.fill();
  }
}
function drawCriticals(){
  const cs=criticals();
  const FONT=getComputedStyle(document.body).fontFamily;
  cx.font=`${11.5*DPR}px ${FONT}`;cx.textAlign="center";cx.textBaseline="bottom";
  for(const c of cs){
    const saddle=c.ev[0]<0||c.ev[1]<0;
    const p=proj(c.x,0,zOf(c.x,0));
    cx.beginPath();cx.arc(p[0],p[1],6*DPR,0,7);
    cx.fillStyle=saddle?"rgba(255,138,92,.95)":"rgba(79,209,165,.95)";cx.fill();
    cx.strokeStyle="rgba(0,0,0,.5)";cx.lineWidth=1.4*DPR;cx.stroke();
    if(S.showLabels){
      cx.fillStyle=saddle?"rgba(255,170,130,.98)":"rgba(140,235,205,.98)";
      cx.fillText(saddle?"鞍点":"极小",p[0],p[1]-10*DPR);
    }
  }
}
function drawTraj(){
  if(S.traj.length<2)return;
  cx.lineWidth=2.4*DPR;cx.strokeStyle="rgba(255,209,102,.9)";
  cx.beginPath();
  for(let i=0;i<S.traj.length;i++){
    const t=S.traj[i],p=proj(t[0],t[1],zOf(t[0],t[1])+.03);
    i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
  }
  cx.stroke();
}
function drawBall(){
  const p=proj(S.x,S.y,zOf(S.x,S.y)+.055);
  const g=cx.createRadialGradient(p[0]-2*DPR,p[1]-2*DPR,1,p[0],p[1],8*DPR);
  g.addColorStop(0,"#fff8e0");g.addColorStop(1,"#ffc233");
  cx.beginPath();cx.arc(p[0],p[1],8*DPR,0,7);cx.fillStyle=g;cx.fill();
  cx.strokeStyle="rgba(0,0,0,.45)";cx.lineWidth=1.4*DPR;cx.stroke();
  /* 负曲率方向：鞍点处指出「往哪儿才是下坡」 */
  if(S.showEscape){
    const h=hAt(S.x);
    if(h[0]<0){
      const L=Math.min(W,H)*.1;
      for(const s of [1,-1]){
        const q=proj(S.x+s*.9,S.y,zOf(S.x+s*.9,S.y)+.05);
        cx.strokeStyle="rgba(255,138,92,.9)";cx.lineWidth=2.4*DPR;
        cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke();
        const a=Math.atan2(q[1]-p[1],q[0]-p[0]),AL=9*DPR;
        cx.beginPath();cx.moveTo(q[0],q[1]);
        cx.lineTo(q[0]-AL*Math.cos(a-.4),q[1]-AL*Math.sin(a-.4));
        cx.lineTo(q[0]-AL*Math.cos(a+.4),q[1]-AL*Math.sin(a+.4));
        cx.closePath();cx.fillStyle="rgba(255,138,92,.9)";cx.fill();
      }
    }
  }
}
function render(){
  fit();
  const c=centerXY();CENX=c[0]*DPR;CENY=c[1]*DPR;
  cx.fillStyle="#080a0e";cx.fillRect(0,0,W,H);
  drawLand();drawTraj();drawCriticals();drawBall();
}

/* ══════════ 高维计数：随机对称矩阵有多大概率正定 ══════════ */
const PD={n:new Array(11).fill(0),c:new Array(11).fill(0)};
function randSym(d){
  const A=[];
  for(let i=0;i<d;i++)A.push(new Float64Array(d));
  for(let i=0;i<d;i++)for(let j=i;j<d;j++){
    let u=0,v=0;
    while(!u)u=Math.random();
    while(!v)v=Math.random();
    A[i][j]=A[j][i]=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)/Math.sqrt(d);
  }
  return A;
}
function isPD(A){
  const d=A.length,L=A.map(r=>Float64Array.from(r));
  for(let i=0;i<d;i++)for(let j=0;j<=i;j++){
    let s=L[i][j];
    for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];
    if(i===j){if(s<=0)return false;L[i][i]=Math.sqrt(s);}
    else L[i][j]=s/L[j][j];
  }
  return true;
}
function samplePD(batch){
  for(let d=1;d<=10;d++)
    for(let k=0;k<batch;k++){PD.n[d]++;if(isPD(randSym(d)))PD.c[d]++;}
}
const c2=$("cv2"),x2=c2.getContext("2d");
function drawPD(){
  const r=c2.getBoundingClientRect();
  const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);
  if(!w||!h)return;
  if(c2.width!==w||c2.height!==h){c2.width=w;c2.height=h;}
  x2.setTransform(1,0,0,1,0,0);x2.clearRect(0,0,w,h);
  const pad={l:34*DPR,r:8*DPR,t:8*DPR,b:18*DPR};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const lo=-6;                                   /* log10 下限 */
  const Y=v=>pad.t+(0-clamp(v,lo,0))/(0-lo)*ih;
  x2.strokeStyle="rgba(255,255,255,.08)";x2.lineWidth=DPR;
  x2.font=`${9*DPR}px ui-monospace,monospace`;x2.textAlign="right";x2.textBaseline="middle";
  for(let g=0;g>=lo;g-=2){
    x2.beginPath();x2.moveTo(pad.l,Y(g));x2.lineTo(w-pad.r,Y(g));x2.stroke();
    x2.fillStyle="rgba(255,255,255,.3)";
    x2.fillText(g===0?"100%":"1e"+g,pad.l-4*DPR,Y(g));
  }
  const bw=iw/10;
  for(let d=1;d<=10;d++){
    const p=PD.n[d]?PD.c[d]/PD.n[d]:0;
    const v=p>0?Math.log10(p):lo;
    const x=pad.l+(d-1)*bw+bw*.18,bwid=bw*.64;
    const y=Y(v),hh=Math.max(1,pad.t+ih-y);
    x2.fillStyle=d===S.dim?"rgba(255,138,92,.95)":"rgba(90,140,255,.55)";
    x2.fillRect(x,y,bwid,hh);
    if(p===0){
      x2.fillStyle="rgba(255,138,92,.9)";x2.textAlign="center";
      x2.fillText("0",x+bwid/2,pad.t+ih-6*DPR);
    }
    x2.fillStyle="rgba(255,255,255,.42)";x2.textAlign="center";x2.textBaseline="top";
    x2.fillText(String(d),x+bwid/2,pad.t+ih+3*DPR);
  }
}

function hud(){
  const g=gAt(S.x,S.y),h=hAt(S.x);
  $("mG").textContent=Math.hypot(g[0],g[1]).toFixed(4);

  $("mH1").parentElement.classList.toggle("n",h[0]<0);
  $("mH1").parentElement.classList.toggle("p",h[0]>=0);
}

/* ══════════ 章节机制 ══════════ */
let si=-1;
function gotoStep(i){
  i=clamp(i,0,CH.length-1);
  const ch=CH[i],changed=(si<0)||(CH[si].c!==ch.c);
  si=i;
  $("stepno").textContent=String(i+1).padStart(2,"0")+" / "+String(CH.length).padStart(2,"0");
  $("sttitle").textContent=ch.t;
  $("stbody").innerHTML=ch.b;$("stbody").scrollTop=0;
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
  $("prev").disabled=i===0;$("next").disabled=i===CH.length-1;
  if(changed){$("ctrlbody").innerHTML=ch.c;bindCtrl();}
  ch.en();
  $("chart").classList.toggle("show",!!ch.chart);
  syncCtrl();
}
function bindCtrl(){
  const sk=$("sK");
  if(sk)sk.oninput=()=>{S.kappa=+sk.value;S.traj=[[S.x,S.y]];syncCtrl();};
  const st=$("sT");
  if(st)st.oninput=()=>{S.t=+st.value;S.traj=[[S.x,S.y]];syncCtrl();};
  const se=$("sEps");
  if(se)se.oninput=()=>{S.eps=+se.value;syncCtrl();};
  const sx=$("sX");
  if(sx)sx.oninput=()=>{S.x0=+sx.value;resetBall(S.x0,1.1);syncCtrl();};
  const sd=$("sD");
  if(sd)sd.oninput=()=>{S.dim=+sd.value;syncCtrl();};
  const bd=$("b_drop");if(bd)bd.onclick=()=>resetBall(1.7,1.3);
  const br=$("b_ridge");if(br)br.onclick=()=>resetBall(0,1.3);
  const bn=$("b_near");if(bn)bn.onclick=()=>resetBall(Math.pow(10,S.eps),1.1);
  const be=$("b_esc");if(be)be.onclick=()=>{S.showEscape=!S.showEscape;syncCtrl();};
  const bx=$("b_dropx");if(bx)bx.onclick=()=>resetBall(S.x0,1.1);
  const bm=$("b_more");if(bm)bm.onclick=()=>{samplePD(2000);syncCtrl();};
}
function say(h,c){const e=$("verdict");e.innerHTML=h;e.className=c||"";}
function syncCtrl(){
  const sk=$("sK");if(sk){sk.value=S.kappa;if($("vK"))$("vK").textContent=S.kappa.toFixed(2);}
  const st=$("sT");if(st){st.value=S.t;if($("vT"))$("vT").textContent=S.t.toFixed(3);}
  const se=$("sEps");if(se){se.value=S.eps;if($("vEps"))$("vEps").textContent="10^"+S.eps.toFixed(1);}
  const sx=$("sX");if(sx){sx.value=S.x0;if($("vX"))$("vX").textContent=(S.x0||0).toFixed(2);}
  const sd=$("sD");if(sd){sd.value=S.dim;if($("vD"))$("vD").textContent=S.dim;}
  const be=$("b_esc");if(be)be.classList.toggle("on",!!S.showEscape);
  const big=$("pdBig");
  if(big){
    const p=PD.n[S.dim]?PD.c[S.dim]/PD.n[S.dim]:0;
    big.innerHTML=p>0
      ? `d = ${S.dim}：${(100*p).toFixed(p<0.01?4:2)} %　是极小`
      : `d = ${S.dim}：抽了 ${PD.n[S.dim].toLocaleString("zh-CN")} 个<br>一个正定的都没有`;
  }
  hud();
  const h=hAt(S.x),g=Math.hypot.apply(null,gAt(S.x,S.y));
  if(si<=0){
    say(S.kappa<0?"κ &lt; 0：地形是一个碗，只有一个极小。":"κ 已经过 0，碗中间被顶起来了。",
        S.kappa<0?"min":"saddle");
  }else if(g<2e-3&&h[0]<0){
    say(`<b>停住了，但这不是最低点。</b>|∇f| = ${g.toFixed(5)}，而 ∂²f/∂x² = ${h[0].toFixed(3)} &lt; 0——沿 x 方向还能继续下降。`,"saddle");
  }else if(g<2e-3){
    say(`<b>到达极小。</b>两个曲率都为正（${h[0].toFixed(2)}, ${h[1].toFixed(2)}），f = ${fAt(S.x,S.y).toFixed(4)}。`,"min");
  }else{
    say(`滚动中：|∇f| = ${g.toFixed(4)}，f = ${fAt(S.x,S.y).toFixed(4)}。`,"");
  }
}

/* ══════════ 相机 ══════════ */
function camTo(az,el,d){CAM.taz=az;CAM.tel=el;CAM.tdist=d;}
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}});
cv.addEventListener("pointermove",e=>{
  if(!drag)return;
  CAM.taz+=(e.clientX-drag.x)*.006;
  CAM.tel=clamp(CAM.tel-(e.clientY-drag.y)*.005,.08,1.3);
  drag={x:e.clientX,y:e.clientY};
});
addEventListener("pointerup",()=>{drag=null;});
cv.addEventListener("wheel",e=>{e.preventDefault();
  CAM.tdist=clamp(CAM.tdist*(e.deltaY>0?.93:1.07),.5,2.2);},{passive:false});

/* ══════════ 主循环 ══════════ */
let tick=0;
function frame(){
  CAM.az+=(CAM.taz-CAM.az)*.12;
  CAM.el+=(CAM.tel-CAM.el)*.12;
  CAM.dist+=(CAM.tdist-CAM.dist)*.12;
  if(S.running)for(let k=0;k<2;k++)stepBall();
  render();
  if(++tick%10===0){syncCtrl();if($("chart").classList.contains("show"))drawPD();}
  requestAnimationFrame(frame);
}

/* ══════════ 自检 ══════════ */
window.__optCheck=(()=>{
  const sv={k:S.kappa,t:S.t};
  const out={};
  /* 1) κ=2, t=0：临界点应为 ±√2 与 0，特征值 (4,1)(−2,1)(4,1) */
  S.kappa=2;S.t=0;
  const cs=criticals();
  out.临界点数=cs.length;
  out.鞍点特征值=cs.filter(c=>c.ev[0]<0).map(c=>+c.ev[0].toFixed(6));
  out.极小位置误差=Math.max(...cs.filter(c=>c.ev[0]>0)
    .map(c=>Math.abs(Math.abs(c.x)-Math.SQRT2)));
  /* 2) 倾斜后两个极小深浅不同 */
  S.t=.35;
  const cs2=criticals().filter(c=>c.ev[0]>0).map(c=>c.f);
  out.倾斜后两极小之差=+(Math.abs(cs2[0]-cs2[1])).toFixed(4);
  S.kappa=sv.k;S.t=sv.t;
  return out;
})();
(()=>{const c=window.__optCheck;
  if(c.临界点数!==3)console.warn("[opt] κ=2 应有 3 个临界点，实得",c.临界点数);
  if(Math.abs(c.鞍点特征值[0]+2)>1e-4)console.warn("[opt] 鞍点特征值应为 −2",c.鞍点特征值);
  if(c.极小位置误差>1e-4)console.warn("[opt] 极小应在 ±√2",c.极小位置误差);
  if(c.倾斜后两极小之差<.5)console.warn("[opt] 倾斜后两极小深度差过小",c.倾斜后两极小之差);})();
</script>
