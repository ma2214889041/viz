<style>

#chart{padding:11px 13px 9px;display:none;flex:0 0 auto}

/* 贴在画面上的活公式：数值随球实时代入，颜色与地图标记一致 */
#live{position:fixed;z-index:16;pointer-events:none;

#loader{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;
  place-items:center;transition:opacity .55s}

@media(max-width:900px){

  #chart{display:none!important}

<body>

<div id="hud">

  <div class="hcell"><span>当前损失 f</span><b id="mF">—</b></div>
  <div class="hcell n"><span>特征值 λ₁</span><b id="mH1">—</b></div>
  <div class="hcell p"><span>特征值 λ₂</span><b id="mH2">—</b></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const $$=s=>[].slice.call(document.querySelectorAll(s));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* ══════════ 地形 ══════════
   这不是一个碗，而是一片有几十个临界点的真实地形。一阶与二阶导数
   全部解析可写，所以每个临界点的类型都能精确判定，不是看图猜的：

     f(x,y) = A·sin(ax)·cos(by) + c(x² + y²)/2

   ∂f/∂x  =  A·a·cos(ax)cos(by) + cx
   ∂f/∂y  = −A·b·sin(ax)sin(by) + cy
   H = [ −A a² sin(ax)cos(by) + c ,  −A a b cos(ax)sin(by)
         −A a b cos(ax)sin(by)   ,  −A b² sin(ax)cos(by) + c ]

   A 控制地形有多崎岖：A → 0 时它退化成一个碗。
*/
const LA=1.6, LB=1.4, LC=0.16;
const S={amp:1,alpha:.05,x:2.6,y:2.2,vx:0,vy:0,running:false,traj:[],dim:1,
  showLabels:true,showTypes:true,x0:2.6,y0:2.2};
const fAt=(x,y)=>S.amp*Math.sin(LA*x)*Math.cos(LB*y)+LC*(x*x+y*y)/2;
const gAt=(x,y)=>[
  S.amp*LA*Math.cos(LA*x)*Math.cos(LB*y)+LC*x,
 -S.amp*LB*Math.sin(LA*x)*Math.sin(LB*y)+LC*y];
const hessAt=(x,y)=>{
  const sc=S.amp*Math.sin(LA*x)*Math.cos(LB*y);
  const cs=S.amp*Math.cos(LA*x)*Math.sin(LB*y);
  return[-LA*LA*sc+LC, -LA*LB*cs, -LB*LB*sc+LC];   /* [fxx, fxy, fyy] */
};
/* 2×2 对称阵的特征值：闭式 */
function eig(h){
  const tr=h[0]+h[2], det=h[0]*h[2]-h[1]*h[1];
  const d=Math.sqrt(Math.max(0,tr*tr-4*det));
  return[(tr-d)/2,(tr+d)/2];
}
const classify=e=>e[0]>1e-9&&e[1]>1e-9?"min":(e[0]<-1e-9&&e[1]<-1e-9?"max":"saddle");

/* 牛顿法从网格出发求全部临界点；类型由解析 Hessian 判定 */
let CRIT=[],critKey="";
function criticals(){
  const key=S.amp.toFixed(3);
  if(key===critKey)return CRIT;
  const R=RX,out=[];
  for(let gx=-R;gx<=R;gx+=.3)for(let gy=-R;gy<=R;gy+=.3){
    let x=gx,y=gy,ok=false;
    for(let it=0;it<50;it++){
      const h=hessAt(x,y),det=h[0]*h[2]-h[1]*h[1];
      if(Math.abs(det)<1e-9)break;
      const g=gAt(x,y);
      const dx=( h[2]*g[0]-h[1]*g[1])/det;
      const dy=(-h[1]*g[0]+h[0]*g[1])/det;
      x-=dx;y-=dy;
      if(Math.abs(x)>R+.6||Math.abs(y)>R+.6)break;
      if(Math.hypot(dx,dy)<1e-12){ok=true;break;}
    }
    if(!ok||Math.abs(x)>R||Math.abs(y)>RY)continue;
    const g=gAt(x,y);
    if(Math.hypot(g[0],g[1])>1e-8)continue;
    if(out.some(q=>Math.hypot(q.x-x,q.y-y)<1e-3))continue;
    const e=eig(hessAt(x,y));
    out.push({x,y,e,f:fAt(x,y),type:classify(e)});
  }
  out.sort((p,q)=>p.f-q.f);
  critKey=key;CRIT=out;
  return out;
}
const critCount=t=>criticals().filter(c=>c.type===t).length;

function resetBall(x,y){
  S.x=x;S.y=y;S.vx=0;S.vy=0;S.traj=[[x,y]];S.running=true;
}
function stepBall(){
  const g=gAt(S.x,S.y);
  S.x=clamp(S.x-S.alpha*g[0],-RX,RX);
  S.y=clamp(S.y-S.alpha*g[1],-RY,RY);
  S.traj.push([S.x,S.y]);
  if(S.traj.length>1200)S.traj.shift();
  if(Math.hypot(g[0],g[1])<1e-5)S.running=false;
}
/* 找离给定点最近的某类临界点 */
function nearestOf(type,x,y){
  const cs=criticals().filter(c=>c.type===type);
  if(!cs.length)return null;
  return cs.reduce((a,c)=>Math.hypot(c.x-x,c.y-y)<Math.hypot(a.x-x,a.y-y)?c:a);
}

/* ══════════ 三维地形渲染 ══════════ */
const cv=$("land"),cx=cv.getContext("2d");
const CAM={az:-.66,el:.34,dist:1,taz:-.66,tel:.34,tdist:1};
let W=0,H=0,DPR=1,CENX=0,CENY=0;
const GX=64, RX=4.0, RY=3.2;
function fit(){
  DPR=Math.min(1.7,devicePixelRatio||1);
  const w=Math.round(innerWidth*DPR),h=Math.round(innerHeight*DPR);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  W=w;H=h;cx.setTransform(1,0,0,1,0,0);
}
/* 视野中心避开两侧面板 */
function centerXY(){
  if(innerWidth<901)return[innerWidth/2,innerHeight*.70];
  const st=$("story").getBoundingClientRect(),ct=$("ctrl").getBoundingClientRect();
  return[(st.right+ct.left)/2,innerHeight*.56];
}
/* 高度直接等于损失：损失大 → 画得高，谷底 = 最低点。
   注意投影里 screen_y = CENY − sy 已经翻过一次符号，这里不能再翻。 */
const ZS=1.55;
const zOf=(x,y)=>fAt(x,y)*ZS;
function proj(x,y,z){
  const ca=Math.cos(CAM.az),sa=Math.sin(CAM.az);
  const ce=Math.cos(CAM.el),se=Math.sin(CAM.el);
  const X=x*ca-y*sa,Y=x*sa+y*ca;
  const sc=Math.min(W,H)*.072*CAM.dist;
  const sx=X,sy=Y*ce+z*se,depth=Y*se-z*ce;
  const pp=1/(1+depth*.04);
  return[CENX+sx*sc*pp, CENY-sy*sc*pp, depth];
}
/* 地形配色：谷深 → 蓝，脊高 → 暖 */
function terrainColor(f,shade){
  /* 地形图配色：低地偏绿，高处偏棕黄 —— 与图例上的高度条一致 */
  const t=clamp((f+1.1)/4.6,0,1);
  const r=Math.round((58+168*Math.pow(t,1.1))*shade);
  const g=Math.round((92+74*t)*shade);
  const b=Math.round((72+30*t-38*t*t)*shade);
  return`rgb(${r},${g},${b})`;
}
function drawLand(){
  const bx=i=>-RX+2*RX*i/GX, by=j=>-RY+2*RY*j/GX;
  const sa=Math.sin(CAM.az),ca=Math.cos(CAM.az),se=Math.sin(CAM.el);
  const cells=[];
  for(let j=0;j<GX;j++)for(let i=0;i<GX;i++){
    const x=bx(i+.5),y=by(j+.5);
    cells.push([i,j,(x*sa+y*ca)*se-zOf(x,y)*Math.cos(CAM.el)]);
  }
  cells.sort((p,q)=>q[2]-p[2]);
  const LX=.42,LY=-.34,LZ=.84;      /* 光照方向 */
  for(const c of cells){
    const i=c[0],j=c[1];
    const x0=bx(i),x1=bx(i+1),y0=by(j),y1=by(j+1);
    const z00=zOf(x0,y0),z10=zOf(x1,y0),z01=zOf(x0,y1),z11=zOf(x1,y1);
    const p00=proj(x0,y0,z00),p10=proj(x1,y0,z10),p11=proj(x1,y1,z11),p01=proj(x0,y1,z01);
    const ax=x1-x0,az=z10-z00,cy2=y1-y0,cz2=z01-z00;
    let nx=-az*cy2,ny=-ax*cz2,nz=ax*cy2;
    const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
    const lam=clamp(nx*LX+ny*LY+nz*LZ,0,1);
    const shade=.34+.66*lam;
    cx.fillStyle=terrainColor(fAt((x0+x1)/2,(y0+y1)/2),shade);
    cx.beginPath();cx.moveTo(p00[0],p00[1]);cx.lineTo(p10[0],p10[1]);
    cx.lineTo(p11[0],p11[1]);cx.lineTo(p01[0],p01[1]);cx.closePath();cx.fill();
  }
}
function drawCriticals(){
  if(!S.showTypes)return;
  const cs=criticals();
  const FONT=getComputedStyle(document.body).fontFamily;
  cx.font=`${10.5*DPR}px ${FONT}`;cx.textAlign="center";cx.textBaseline="bottom";
  const col={min:"#2f7d5e",saddle:"#c25a2b",max:"#9b2f45"};
  const best=cs[0];
  for(const c of cs){
    const p=proj(c.x,c.y,zOf(c.x,c.y));
    const r=(c===best?7:5)*DPR;
    cx.beginPath();cx.arc(p[0],p[1],r,0,7);
    cx.fillStyle=col[c.type];cx.fill();
    cx.strokeStyle="rgba(233,229,219,.85)";cx.lineWidth=1.4*DPR;cx.stroke();
    if(c===best&&S.showLabels){
      cx.fillStyle="#e9e5db";cx.fillText("全局最优",p[0],p[1]-11*DPR);
    }
  }
}
function drawTraj(){
  if(S.traj.length<2)return;
  cx.lineWidth=2.2*DPR;cx.strokeStyle="rgba(233,229,219,.9)";
  cx.beginPath();
  for(let i=0;i<S.traj.length;i++){
    const t=S.traj[i],p=proj(t[0],t[1],zOf(t[0],t[1])+.03);
    i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]);
  }
  cx.stroke();
}
function drawBall(){
  const p=proj(S.x,S.y,zOf(S.x,S.y)+.055);
  const g=cx.createRadialGradient(p[0]-2*DPR,p[1]-2*DPR,1,p[0],p[1],8*DPR);
  g.addColorStop(0,"#fdfaf2");g.addColorStop(1,"#d8c9a4");
  cx.beginPath();cx.arc(p[0],p[1],8*DPR,0,7);cx.fillStyle=g;cx.fill();
  cx.strokeStyle="#1d2226";cx.lineWidth=1.6*DPR;cx.stroke();
  /* 负曲率方向：鞍点处指出「往哪儿才是下坡」 */
  if(S.showEscape){
    const h=hAt(S.x);
    if(h[0]<0){
      const L=Math.min(W,H)*.1;
      for(const s of [1,-1]){
        const q=proj(S.x+s*.9,S.y,zOf(S.x+s*.9,S.y)+.05);
        cx.strokeStyle="rgba(255,138,92,.9)";cx.lineWidth=2.4*DPR;
        cx.beginPath();cx.moveTo(p[0],p[1]);cx.lineTo(q[0],q[1]);cx.stroke();
        const a=Math.atan2(q[1]-p[1],q[0]-p[0]),AL=9*DPR;
        cx.beginPath();cx.moveTo(q[0],q[1]);
        cx.lineTo(q[0]-AL*Math.cos(a-.4),q[1]-AL*Math.sin(a-.4));
        cx.lineTo(q[0]-AL*Math.cos(a+.4),q[1]-AL*Math.sin(a+.4));
        cx.closePath();cx.fillStyle="rgba(255,138,92,.9)";cx.fill();
      }
    }
  }
}
/* 高度含义指示器：明确「往哪边是优化方向」 */
function drawCompass(){

  const x=CENX+Math.min(W,H)*.30, y0=CENY-Math.min(W,H)*.13, y1=CENY+Math.min(W,H)*.13;

}
function updateLive(){

function syncHudH(){

/* ══════════ 高维计数：随机对称矩阵有多大概率正定 ══════════ */
const PD={n:new Array(11).fill(0),c:new Array(11).fill(0)};
function randSym(d){
  const A=[];
  for(let i=0;i<d;i++)A.push(new Float64Array(d));
  for(let i=0;i<d;i++)for(let j=i;j<d;j++){
    let u=0,v=0;
    while(!u)u=Math.random();
    while(!v)v=Math.random();
    A[i][j]=A[j][i]=Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)/Math.sqrt(d);
  }
  return A;
}
function isPD(A){
  const d=A.length,L=A.map(r=>Float64Array.from(r));
  for(let i=0;i<d;i++)for(let j=0;j<=i;j++){
    let s=L[i][j];
    for(let k=0;k<j;k++)s-=L[i][k]*L[j][k];
    if(i===j){if(s<=0)return false;L[i][i]=Math.sqrt(s);}
    else L[i][j]=s/L[j][j];
  }
  return true;
}
function samplePD(batch){
  for(let d=1;d<=10;d++)
    for(let k=0;k<batch;k++){PD.n[d]++;if(isPD(randSym(d)))PD.c[d]++;}
}
const c2=$("cv2"),x2=c2.getContext("2d");
function drawPD(){
  const r=c2.getBoundingClientRect();
  const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);
  if(!w||!h)return;
  if(c2.width!==w||c2.height!==h){c2.width=w;c2.height=h;}
  x2.setTransform(1,0,0,1,0,0);x2.clearRect(0,0,w,h);
  const pad={l:34*DPR,r:8*DPR,t:8*DPR,b:18*DPR};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const lo=-6;                                   /* log10 下限 */
  const Y=v=>pad.t+(0-clamp(v,lo,0))/(0-lo)*ih;
  x2.strokeStyle="rgba(255,255,255,.08)";x2.lineWidth=DPR;
  x2.font=`${9*DPR}px ui-monospace,monospace`;x2.textAlign="right";x2.textBaseline="middle";
  for(let g=0;g>=lo;g-=2){
    x2.beginPath();x2.moveTo(pad.l,Y(g));x2.lineTo(w-pad.r,Y(g));x2.stroke();
    x2.fillStyle="rgba(255,255,255,.3)";
    x2.fillText(g===0?"100%":"1e"+g,pad.l-4*DPR,Y(g));
  }
  const bw=iw/10;
  for(let d=1;d<=10;d++){
    const p=PD.n[d]?PD.c[d]/PD.n[d]:0;
    const v=p>0?Math.log10(p):lo;
    const x=pad.l+(d-1)*bw+bw*.18,bwid=bw*.64;
    const y=Y(v),hh=Math.max(1,pad.t+ih-y);
    x2.fillStyle=d===S.dim?"rgba(255,138,92,.95)":"rgba(90,140,255,.55)";
    x2.fillRect(x,y,bwid,hh);
    if(p===0){
      x2.fillStyle="rgba(255,138,92,.9)";x2.textAlign="center";
      x2.fillText("0",x+bwid/2,pad.t+ih-6*DPR);
    }
    x2.fillStyle="rgba(255,255,255,.42)";x2.textAlign="center";x2.textBaseline="top";
    x2.fillText(String(d),x+bwid/2,pad.t+ih+3*DPR);
  }
}

function hud(){
  const g=gAt(S.x,S.y),e=eig(hessAt(S.x,S.y));
  $("mG").textContent=Math.hypot(g[0],g[1]).toFixed(4);
  $("mF").textContent=fAt(S.x,S.y).toFixed(4);
  $("mH1").textContent=e[0].toFixed(3);
  $("mH2").textContent=e[1].toFixed(3);
  $("mH1").parentElement.className="hcell "+(e[0]<0?"n":"p");
  $("mH2").parentElement.className="hcell "+(e[1]<0?"n":"p");
}

  si=i;

  $("stbody").innerHTML=ch.b;$("stbody").scrollTop=0;
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
  $("prev").disabled=i===0;$("next").disabled=i===CH.length-1;
  if(changed){$("ctrlbody").innerHTML=ch.c;bindCtrl();}
  ch.en();
  $("chart").classList.toggle("show",!!ch.chart);
  syncCtrl();
}
function bindCtrl(){
  const sa=$("sA");
  if(sa)sa.oninput=()=>{S.amp=+sa.value;S.traj=[[S.x,S.y]];syncCtrl();};
  const sd=$("sD");
  if(sd)sd.oninput=()=>{S.dim=+sd.value;syncCtrl();};
  const sx=$("sX");
  if(sx)sx.oninput=()=>{S.x0=+sx.value;resetBall(S.x0,S.y0);syncCtrl();};
  const sy=$("sY");
  if(sy)sy.oninput=()=>{S.y0=+sy.value;resetBall(S.x0,S.y0);syncCtrl();};
  const bd=$("b_drop");
  if(bd)bd.onclick=()=>resetBall((Math.random()*2-1)*RX*.85,(Math.random()*2-1)*RY*.85);
  const bf=$("b_flat");
  if(bf)bf.onclick=()=>{S.amp=0;resetBall(3.2,2.4);syncCtrl();};
  const br=$("b_rough");
  if(br)br.onclick=()=>{S.amp=1.3;resetBall(3.2,2.4);syncCtrl();};
  const bs=$("b_saddle");
  if(bs)bs.onclick=()=>{
    const cs=criticals().filter(c=>c.type==="saddle");
    if(!cs.length)return;
    const c=cs[Math.floor(Math.random()*cs.length)];
    resetBall(c.x,c.y);
  };
  const bt=$("b_types");
  if(bt)bt.onclick=()=>{S.showTypes=!S.showTypes;syncCtrl();};
  const bm=$("b_more");
  if(bm)bm.onclick=()=>{samplePD(2000);syncCtrl();};
  const bx=$("b_dropxy");
  if(bx)bx.onclick=()=>resetBall(S.x0,S.y0);
}
function say(h,c){const e=$("verdict");e.innerHTML=h;e.className=c||"";}
function syncCtrl(){
  const sa=$("sA");if(sa){sa.value=S.amp;if($("vA"))$("vA").textContent=S.amp.toFixed(2);}
  const sd=$("sD");if(sd){sd.value=S.dim;if($("vD"))$("vD").textContent=S.dim;}
  const sx=$("sX");if(sx){sx.value=S.x0;if($("vX"))$("vX").textContent=S.x0.toFixed(2);}
  const sy=$("sY");if(sy){sy.value=S.y0;if($("vY"))$("vY").textContent=S.y0.toFixed(2);}
  const bt=$("b_types");if(bt)bt.classList.toggle("on",!!S.showTypes);
  const cb=$("countBig");
  if(cb){
    const mn=critCount("min"),sd2=critCount("saddle"),mx=critCount("max");
    cb.innerHTML=`这片地形共 ${mn+sd2+mx} 个临界点<br>`+
      `<span style="color:#4fd1a5">极小 ${mn}</span>　`+
      `<span style="color:#ff8a5c">鞍点 ${sd2}</span>　`+
      `<span style="color:#e85a6e">极大 ${mx}</span>`;
  }
  const pb=$("pdBig");
  if(pb){
    const p=PD.n[S.dim]?PD.c[S.dim]/PD.n[S.dim]:0;
    pb.innerHTML=p>0
      ? `d = ${S.dim}：${(100*p).toFixed(p<.01?4:2)} % 是极小`
      : `d = ${S.dim}：抽了 ${PD.n[S.dim].toLocaleString("zh-CN")} 个<br>一个正定的都没有`;
  }
  hud();
  const g=gAt(S.x,S.y),gn=Math.hypot(g[0],g[1]),e=eig(hessAt(S.x,S.y));
  /* 特征值按符号着色：负=鞍点橙，正=极小绿。与地图上的标记、
     公式里的 λ 用的是同一套颜色，符号和它指的东西因此对上号。 */
  const ev=v=>`<span class="${v<0?"t-sad":"t-min"}">${v>=0?"+":""}${v.toFixed(2)}</span>`;
  if(gn>1e-3){
    say(`滚动中：|∇f| = ${gn.toFixed(4)}，f = ${fAt(S.x,S.y).toFixed(4)}。`,"");
  }else{
    const t=classify(e);
    if(t==="saddle")
      say(`<b>停住了，但这不是最低点。</b>|∇f| = ${gn.toFixed(6)}，特征值 (${ev(e[0])}, ${ev(e[1])})——<b>一正一负</b>，沿负的那个方向还能继续下降。`,"saddle");
    else if(t==="max")
      say(`<b>停在了极大点。</b>特征值 (${ev(e[0])}, ${ev(e[1])}) 都为负，四周全是下坡。`,"saddle");
    else{
      const cs=criticals(),best=cs[0],here=fAt(S.x,S.y);
      const isBest=best&&Math.abs(here-best.f)<1e-6;
      say(isBest
        ?`<b>到达全局最优。</b>特征值 (${ev(e[0])}, ${ev(e[1])}) 都为正，f = ${here.toFixed(4)}，是全场最低。`
        :`<b>到达一个局部最优。</b>特征值都为正，f = ${here.toFixed(4)}；但全局最优是 ${best.f.toFixed(4)}，还差 ${(here-best.f).toFixed(4)}。`,
        "min");
    }
  }
}
/* ══════════ 相机 ══════════ */
function camTo(az,el,d){CAM.taz=az;CAM.tel=el;CAM.tdist=d;}
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};
  try{cv.setPointerCapture(e.pointerId);}catch(err){}});
cv.addEventListener("pointermove",e=>{
  if(!drag)return;
  CAM.taz+=(e.clientX-drag.x)*.006;
  CAM.tel=clamp(CAM.tel-(e.clientY-drag.y)*.005,.08,1.3);
  drag={x:e.clientX,y:e.clientY};
});
addEventListener("pointerup",()=>{drag=null;});
cv.addEventListener("wheel",e=>{e.preventDefault();
  CAM.tdist=clamp(CAM.tdist*(e.deltaY>0?.93:1.07),.5,2.2);},{passive:false});

/* ══════════ 主循环 ══════════ */
let tick=0;
function frame(){
  CAM.az+=(CAM.taz-CAM.az)*.12;
  CAM.el+=(CAM.tel-CAM.el)*.12;
  CAM.dist+=(CAM.tdist-CAM.dist)*.12;
  if(S.running)for(let k=0;k<2;k++)stepBall();
  render();
  if(++tick%10===0){syncCtrl();if($("chart").classList.contains("show"))drawPD();}
  requestAnimationFrame(frame);
}

$("prev").onclick=()=>gotoStep(si-1);
$("next").onclick=()=>gotoStep(si+1);
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")gotoStep(si-1);
  if(e.key==="ArrowRight")gotoStep(si+1);
});
$$("#switch button").forEach(b=>b.onclick=()=>{
  document.body.className="pm-"+b.dataset.panel;
  $$("#switch button").forEach(x=>x.classList.toggle("on",x===b));
});

/* ══════════ 启动 ══════════ */
S.eps=-3;S.x0=1.2;
$("dots").innerHTML=CH.map(()=>"<i></i>").join("");
$$("#dots i").forEach((d,k)=>d.onclick=()=>gotoStep(k));
document.body.className="pm-story";
$("chCap").textContent="横轴为维数 d，纵轴对数。橙色是当前选中的维数。";
gotoStep(0);
requestAnimationFrame(frame);
setTimeout(()=>{$("loader").classList.add("hide");
  setTimeout(()=>$("loader").style.display="none",600);},240);

/* ══════════ 自检 ══════════ */
window.__optCheck=(()=>{
  const sv=S.amp;S.amp=1;critKey="";
  const cs=criticals();
  const n=t=>cs.filter(c=>c.type===t).length;
  let maxG=0;
  for(const c of cs){const g=gAt(c.x,c.y);maxG=Math.max(maxG,Math.hypot(g[0],g[1]));}
  const out={临界点:cs.length,极小:n("min"),鞍点:n("saddle"),极大:n("max"),
    最大残余梯度:maxG,鞍点比极小:+(n("saddle")/Math.max(1,n("min"))).toFixed(2)};
  S.amp=0;critKey="";
  out.A为0时临界点=criticals().length;
  S.amp=sv;critKey="";
  return out;
})();
(()=>{const c=window.__optCheck;
  if(c.最大残余梯度>1e-7)console.warn("[opt] 临界点求解未收敛",c.最大残余梯度);
  if(c.鞍点<=c.极小)console.warn("[opt] 鞍点应多于极小",c);
  if(c.A为0时临界点!==1)console.warn("[opt] A=0 时应只有一个临界点",c.A为0时临界点);})();
</script>
