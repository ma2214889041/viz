<script>
"use strict";
const $=id=>document.getElementById(id);
const $$=s=>[].slice.call(document.querySelectorAll(s));
const clamp=(x,a,b)=>x<a?a:x>b?b:x;

/* ══════════ 模型 ══════════
   f(x) = ½(λ₁x₁² + λ₂x₂²)，λ₁ = 1，λ₂ = κ。
   坐标已旋转到 A 的特征方向，两个方向互不耦合，各自是一维递推。
     梯度下降    x⁽ᵏ⁺¹⁾ = (1 − αλ)x⁽ᵏ⁾
     Heavy-ball  x⁽ᵏ⁺¹⁾ = (1 + β − αλ)x⁽ᵏ⁾ − βx⁽ᵏ⁻¹⁾
                 特征方程 r² − (1 + β − αλ)r + β = 0
*/
const S={kappa:100,s:1,beta:0,mom:false,k:0,autoStep:true,x0:[3,1.35]};
const alpha=()=>S.s/S.kappa;                 /* s = αλ₂ 归一化步长 */
const gdOptS=()=>2*S.kappa/(1+S.kappa);      /* α*=2/(λ₁+λ₂) → s*=2κ/(1+κ) */
const gdOptRho=()=>(S.kappa-1)/(S.kappa+1);
const hbOptAlpha=()=>4/Math.pow(1+Math.sqrt(S.kappa),2);
const hbOptBeta=()=>Math.pow((Math.sqrt(S.kappa)-1)/(Math.sqrt(S.kappa)+1),2);
const hbOptRho=()=>(Math.sqrt(S.kappa)-1)/(Math.sqrt(S.kappa)+1);

function rootsFor(t,beta){
  const sum=1+beta-t, disc=sum*sum-4*beta;
  if(disc>=0){
    const r=Math.sqrt(disc),r1=(sum+r)/2,r2=(sum-r)/2;
    return{radius:Math.max(Math.abs(r1),Math.abs(r2)),complex:false};
  }
  return{radius:Math.sqrt(beta),complex:true};
}
function rateFor(l){
  const t=alpha()*l;
  return S.mom?rootsFor(t,S.beta).radius:Math.abs(1-t);
}
const worstRate=()=>Math.max(rateFor(1),rateFor(S.kappa));
function stepsTo(target){
  const r=worstRate();
  return r>=1?Infinity:Math.ceil(Math.log(target)/Math.log(r));
}

let traj=[];
function buildTraj(n){
  const L=[1,S.kappa],a=alpha();
  let x=[S.x0[0],S.x0[1]],xp=[S.x0[0],S.x0[1]];
  traj=[[x[0],x[1]]];
  for(let k=0;k<n;k++){
    const nx=[0,0];
    for(let i=0;i<2;i++)
      nx[i]=S.mom?(1+S.beta-a*L[i])*x[i]-S.beta*xp[i]:(1-a*L[i])*x[i];
    xp=x;x=nx;
    if(!isFinite(x[0])||!isFinite(x[1])||Math.abs(x[0])>1e5||Math.abs(x[1])>1e5){
      traj.push([clamp(x[0],-1e5,1e5),clamp(x[1],-1e5,1e5)]);break;
    }
    traj.push([x[0],x[1]]);
  }
}
const lossAt=(a,b)=>.5*(a*a+S.kappa*b*b);
const loss0=()=>lossAt(S.x0[0],S.x0[1]);

/* ══════════ 渲染：全屏等高线平面 ══════════
   这里刻意不用三维曲面。高度承载的信息与等高线完全重复，
   还会遮挡轨迹；而本文的核心论点——「梯度指向谷壁，不指向谷底」
   ——只有在平面上画出梯度向量才看得清楚。 */
const cv=$("surf"),cx=cv.getContext("2d");
const CAM={dist:1,tdist:1};
let W=0,H=0,DPR=1,VX=0,VY=0;
function fit(){
  DPR=Math.min(2,devicePixelRatio||1);
  const w=Math.round(innerWidth*DPR),h=Math.round(innerHeight*DPR);
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
  W=w;H=h;cx.setTransform(1,0,0,1,0,0);
}
/* 视野：x₁ 固定，x₂ 由轨迹覆盖范围决定 */
/* 视野由「过起点的那条等高线」决定，保证它完整可见：
   f₀ = ½(x₁² + κx₂²)，半轴 √(2f₀) 与 √(2f₀/κ)。 */
function extent(){
  const f0=loss0()||1;
  let ex=Math.sqrt(2*f0)*1.18, ey=Math.max(Math.sqrt(2*f0/S.kappa),0.35)*1.5;
  /* 动量会让轨迹在陡峭方向过冲，视野要把它一起装下 */
  for(const t of traj){
    const a=Math.abs(t[0]),b=Math.abs(t[1]);
    if(a<1e4&&a*1.12>ex)ex=a*1.12;
    if(b<1e4&&b*1.18>ey)ey=b*1.18;
  }
  return[ex,ey];
}
const ry=()=>extent()[1];
/* 视野中心避开讲解面板与控制面板，与挂谷篇同一套做法 */
function freeCenter(){
  const st=$("story").getBoundingClientRect(), ct=$("ctrl").getBoundingClientRect();
  const narrow=innerWidth<901;
  if(narrow)return[innerWidth/2, innerHeight*0.68];
  const l=st.right+16, r=ct.left-16;
  return[(l+r)/2, innerHeight*0.55];
}
function setView(){
  const e=extent(), RXe=e[0], RY=e[1];
  const c=freeCenter();
  const availW=(innerWidth<901?innerWidth*0.94:Math.max(240,$("ctrl").getBoundingClientRect().left-$("story").getBoundingClientRect().right-40))*DPR;
  const availH=(innerWidth<901?innerHeight*0.44:innerHeight*0.80)*DPR;
  const sc=Math.min(availW/(2*RXe), availH/(2*RY))*CAM.dist;
  VX=sc;VY=sc;CENX=c[0]*DPR;CENY=c[1]*DPR;
  return RY;
}
let CENX=0,CENY=0;
const PX=x=>CENX+x*VX;
const PY=y=>CENY-y*VY;

function drawField(){
  const RY=setView();
  cx.fillStyle="#0a0c10";cx.fillRect(0,0,W,H);
  /* 填充式等高带：越靠谷底越暗 */
  const f0=loss0()||1;
  const bands=13;
  for(let c=bands;c>=1;c--){
    const fv=f0*Math.pow(c/bands,1.6)*1.35;
    const ax=Math.sqrt(2*fv), by=Math.sqrt(2*fv/S.kappa);
    const t=c/bands;
    cx.fillStyle=`rgb(${Math.round(12+58*t)},${Math.round(15+72*t)},${Math.round(22+112*t)})`;
    cx.beginPath();
    cx.ellipse(PX(0),PY(0),ax*VX,by*VY,0,0,Math.PI*2);
    cx.fill();
  }
  /* 等高线 */
  cx.lineWidth=DPR;
  for(let c=1;c<=bands;c++){
    const fv=f0*Math.pow(c/bands,1.6)*1.35;
    const ax=Math.sqrt(2*fv), by=Math.sqrt(2*fv/S.kappa);
    cx.strokeStyle="rgba(180,205,255,.16)";
    cx.beginPath();cx.ellipse(PX(0),PY(0),ax*VX,by*VY,0,0,Math.PI*2);cx.stroke();
  }
  /* 两条特征轴 */
  cx.lineWidth=1.6*DPR;
  cx.strokeStyle="rgba(90,140,255,.7)";
  const RXe=extent()[0];
  cx.beginPath();cx.moveTo(PX(-RXe),PY(0));cx.lineTo(PX(RXe),PY(0));cx.stroke();
  cx.strokeStyle="rgba(255,138,92,.7)";
  cx.beginPath();cx.moveTo(PX(0),PY(-RY));cx.lineTo(PX(0),PY(RY));cx.stroke();
  const FONT=getComputedStyle(document.body).fontFamily;
  cx.font=`${12*DPR}px ${FONT}`;cx.textBaseline="middle";
  cx.fillStyle="rgba(90,140,255,.95)";cx.textAlign="right";
  cx.fillText("平坦方向 λ₁ = 1  →",PX(RXe)-10*DPR,PY(0)-14*DPR);
  cx.fillStyle="rgba(255,138,92,.95)";cx.textAlign="center";
  cx.fillText("陡峭方向 λ₂ = κ",PX(0),PY(RY)-14*DPR);
  /* 谷底 */
  cx.beginPath();cx.arc(PX(0),PY(0),4*DPR,0,7);
  cx.fillStyle="rgba(255,255,255,.85)";cx.fill();
}
function arrow(x0,y0,x1,y1,col,wid){
  cx.strokeStyle=col;cx.lineWidth=wid;
  cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();
  const a=Math.atan2(y1-y0,x1-x0),L=8*DPR;
  cx.beginPath();cx.moveTo(x1,y1);
  cx.lineTo(x1-L*Math.cos(a-.4),y1-L*Math.sin(a-.4));
  cx.lineTo(x1-L*Math.cos(a+.4),y1-L*Math.sin(a+.4));
  cx.closePath();cx.fillStyle=col;cx.fill();
}
function drawTraj(){
  if(traj.length<2)return;
  const n=Math.min(traj.length-1,S.k);
  cx.lineWidth=2.4*DPR;
  cx.strokeStyle=S.mom?"rgba(79,209,165,.95)":"rgba(255,209,102,.95)";
  cx.beginPath();
  for(let i=0;i<=n;i++){
    const t=traj[i];i?cx.lineTo(PX(t[0]),PY(t[1])):cx.moveTo(PX(t[0]),PY(t[1]));
  }
  cx.stroke();
  for(let i=0;i<=n;i++){
    if(i!==n&&i%2)continue;
    const t=traj[i];
    cx.beginPath();cx.arc(PX(t[0]),PY(t[1]),(i===n?5.5:2)*DPR,0,7);
    cx.fillStyle=i===n?"#fff":(S.mom?"rgba(79,209,165,.8)":"rgba(255,209,102,.7)");
    cx.fill();
  }
  /* 当前点的梯度：∇f = (λ₁x₁, λ₂x₂)。这一箭头是本文的核心论点 */
  const t=traj[n];
  const gx=t[0], gy=S.kappa*t[1];
  const gl=Math.hypot(gx,gy)||1;
  const L=Math.min(W,H)*0.15;
  const x0=PX(t[0]),y0=PY(t[1]);
  arrow(x0,y0,x0-gx/gl*L,y0+gy/gl*L,"rgba(255,110,110,.95)",2.6*DPR);
  const FONT=getComputedStyle(document.body).fontFamily;
  cx.font=`${11.5*DPR}px ${FONT}`;cx.textAlign="left";cx.textBaseline="middle";
  cx.fillStyle="rgba(255,140,140,.95)";
  cx.fillText("−∇f",x0-gx/gl*L+11*DPR,y0+gy/gl*L+9*DPR);
  cx.font=`${12*DPR}px ${FONT}`;
  cx.fillStyle="rgba(255,255,255,.92)";cx.textBaseline="bottom";
  cx.textAlign="right";cx.fillText(`第 ${n} 步`,x0-12*DPR,y0-10*DPR);
}
function render(){fit();drawField();drawTraj();}

/* ══════════ 侧图 ══════════ */
const c2=$("cv2"),x2=c2.getContext("2d");
function drawChart(){
  const r=c2.getBoundingClientRect();
  const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);
  if(!w||!h)return;
  if(c2.width!==w||c2.height!==h){c2.width=w;c2.height=h;}
  x2.setTransform(1,0,0,1,0,0);x2.clearRect(0,0,w,h);
  const pad={l:32*DPR,r:8*DPR,t:8*DPR,b:14*DPR};
  const iw=w-pad.l-pad.r,ih=h-pad.t-pad.b;
  const NS=Math.min(traj.length-1,200),lo=-6,hi=0;
  const X=i=>pad.l+i/Math.max(1,NS)*iw;
  const Y=v=>pad.t+(hi-clamp(v,lo,hi))/(hi-lo)*ih;
  x2.strokeStyle="rgba(255,255,255,.08)";x2.lineWidth=DPR;
  x2.font=`${9*DPR}px ui-monospace,monospace`;x2.textAlign="right";x2.textBaseline="middle";
  for(let g=lo;g<=hi;g+=2){
    x2.beginPath();x2.moveTo(pad.l,Y(g));x2.lineTo(w-pad.r,Y(g));x2.stroke();
    x2.fillStyle="rgba(255,255,255,.32)";x2.fillText("1e"+g,pad.l-4*DPR,Y(g));
  }
  const L0=loss0();
  const series=[["#5a8cff",i=>.5*traj[i][0]*traj[i][0]],
                ["#ff8a5c",i=>.5*S.kappa*traj[i][1]*traj[i][1]]];
  for(const s of series){
    x2.strokeStyle=s[0];x2.lineWidth=1.8*DPR;x2.beginPath();
    for(let i=0;i<=NS;i++){
      const val=Math.log10(Math.max(1e-14,s[1](i)/L0));
      const px=X(i),py=Y(val);i?x2.lineTo(px,py):x2.moveTo(px,py);
    }
    x2.stroke();
  }
  const kk=Math.min(S.k,NS);
  x2.strokeStyle="rgba(255,255,255,.42)";x2.lineWidth=DPR;x2.setLineDash([3*DPR,3*DPR]);
  x2.beginPath();x2.moveTo(X(kk),pad.t);x2.lineTo(X(kk),h-pad.b);x2.stroke();x2.setLineDash([]);
}

/* ══════════ HUD ══════════ */
function hud(){
  $("mK").textContent=S.kappa.toFixed(0);
  $("mSlow").textContent=rateFor(1).toFixed(4);
  $("mFast").textContent=rateFor(S.kappa).toFixed(4);
  const st=stepsTo(.01);
  $("mSteps").textContent=isFinite(st)?st+" 步":"不收敛";
}

/* ══════════ 控件模板 ══════════ */

const C_MOM=`
  <div class="knob"><div class="knob-head"><label for="sKappa">条件数 κ</label><b id="vKappa"></b></div>

/* ══════════ 章节 ══════════ */
const CH=[
{t:"一个完美的碗",c:C_KAPPA,chart:false,
 b:`<p>屏幕上是<b>损失的等高线</b>：每一圈是一个等损失面，越往里损失越低，正中央白点是最优解。红色箭头是当前位置的 −∇f，也就是这一步真正要走的方向。</p>
    <p>现在 κ = 1，两个方向弯得一样快——等高线是一圈圈<em>正圆</em>，箭头笔直指向圆心。</p>
    <p>按「从头跑一遍」。梯度下降<em>笔直</em>滑到谷底，几步就到。</p>
    <p class="q">在最优点附近，很多光滑损失都能用二次型近似。把坐标旋转到矩阵 A 的特征方向后，曲面不再耦合：f(x) = ½(λ₁x₁² + λ₂x₂²)。蓝、橙两条轴就是这两个特征方向。</p>`,
 en(){S.kappa=1;S.mom=false;S.beta=0;S.autoStep=true;S.s=gdOptS();
      camTo(-.7,.78,1);}},

{t:"把碗压扁",c:C_KAPPA,chart:false,
 b:`<p>把 κ 拉大。等高线从正圆被拉成<b>狭长的椭圆</b>：沿橙色方向陡、沿蓝色方向几乎平坦——这就是一条峡谷。</p>
    <p>再跑一次。轨迹不再笔直：它先<em>横着弹几下</em>，再沿谷底慢慢爬。</p>
    <p>原因就画在屏幕上：红色箭头<em>永远垂直于等高线</em>，而峡谷里的等高线几乎是平行长条——于是它几乎横穿峡谷，<b>指向谷壁，而不是谷底</b>。谷底就在正前方，梯度偏偏不朝那儿指。</p>
    <p class="q">κ 不是"看起来有多瘦"这种修辞，它就是 λ₂/λ₁，两个特征值的比。</p>`,
 en(){if(S.kappa<8||S.kappa>60)S.kappa=20;S.mom=false;S.beta=0;S.autoStep=true;S.s=gdOptS();}},

{t:"两只时钟",c:C_STEP,chart:true,
 b:`<p>把同一次更新拆到两个特征方向上，它们互不干扰，各自是一个几何数列：</p>
    <span class="fml">xᵢ⁽ᵏ⁾ = (1 − αλᵢ)ᵏ · xᵢ⁽⁰⁾</span>
    <p>同一个步长，对两个方向给出<b>完全不同</b>的收缩倍数。右下角两条曲线就是这两份误差。</p>
    <p>拖动步长看它们此消彼长：想让平坦方向快些，就得把步长调大；可步长一大，陡峭方向就开始来回跨过谷底。</p>
    <p><em>"先快后慢"不是优化器突然变差了。</em>是陡峭方向的误差先被清完，剩下平坦方向按它自己的速度慢慢磨。</p>`,
 en(){if(S.kappa<8)S.kappa=100;S.mom=false;S.beta=0;S.autoStep=false;
      camTo(-.6,.68,1.05);}},

{t:"调到最优，还是这么慢",c:C_STEP,chart:true,
 b:`<p>那把步长调到<b>最好</b>呢？让两个方向的收缩率恰好相等，就得到梯度下降的最优固定步长：</p>
    <span class="fml">α* = 2/(λ₁+λ₂)</span>
    <p>按右侧按钮跳过去。此时一个方向从正面缓慢靠近，另一个跨过谷底来回振荡（轨迹明显来回穿越橙色轴），但两者<b>衰减一样快</b>。这已经是任何固定步长的极限。</p>
    <p>而这个极限是：</p>
    <span class="big" id="rhoBig"></span>
    <p>κ = 100 时 ρ* = <b>0.9802</b>。每步只把误差乘 0.98——听着还行，可你要连乘<em>几百次</em>它才真正变小。</p>
    <p>优化器没有卡住，也没调错。<b>它已经处在这个几何下的最好状态，而最好状态就是这么慢。</b>这就是条件数的算法含义。</p>`,
 en(){if(S.kappa<8)S.kappa=100;S.mom=false;S.beta=0;S.autoStep=false;S.s=gdOptS();
      camTo(-.55,.72,1.05);}},

{t:"给它一点记忆",c:C_MOM,chart:true,
 b:`<p>固定步长的上限是 (κ−1)/(κ+1)。想突破，就得让更新<b>记住上一步</b>：</p>
    <span class="fml">zₖ₊₁ = βzₖ + ∇f(wₖ)
wₖ₊₁ = wₖ − αzₖ₊₁</span>
    <p>消去 z，每个方向不再是一阶数列，而是<b>依赖前两步</b>的二阶递推，特征方程 r² − (1+β−αλ)r + β = 0。两根可以是实数，也可以是一对共轭复根——后者正对应<em>衰减中的振荡</em>。</p>
    <p>按「最优动量」。轨迹从横向弹跳变成<em>绕着谷底盘旋</em>，损失甚至不再单调下降，但它到得<b>快得多</b>。</p>
    <span class="big" id="rhoBig"></span>
    <p>κ = 100：0.9802 → <b>0.8182</b>。κ 变成了 √κ。加速来自二阶递推的特征根，不是因为"步子更大胆"。</p>`,
 en(){if(S.kappa<8)S.kappa=100;S.mom=true;S.autoStep=false;
      S.s=hbOptAlpha()*S.kappa;S.beta=hbOptBeta();
      camTo(-.62,.7,1.05);}},

{t:"越界之后",c:C_MOM,chart:true,
 b:`<p>记忆不是白拿的。把步长继续拉大，会越过一条边界：</p>
    <span class="fml">s = αλ₂ &lt; 2(1 + β)</span>
    <p>越过它，某个方向的特征根模长 ≥ 1，误差不再衰减，而是被记忆<b>逐步放大</b>——轨迹会一圈圈甩向外面。</p>
    <p>把 β 调大，这条边界会向右移：动量越大，能容忍的步长越大。这也是为什么"调大动量"和"调大学习率"常常要一起做。</p>
    <p class="q">曲面上的轨迹逐步执行真实更新；收缩率、最优参数与这条边界来自同一组特征根公式，并由独立数值测试在 κ ∈ {1.1, 2, 10, 100, 1000} 上覆盖验证。</p>
    <p class="q">路线取自 Gabriel Goh 的 <i>Why Momentum Really Works</i>（Distill, 2017），问题、图形与交互重新设计。结论精确属于固定正定二次型；非凸网络、随机梯度噪声与自适应优化器需另行分析。</p>`,
 en(){if(S.kappa<8)S.kappa=100;S.mom=true;S.autoStep=false;
      camTo(-.68,.6,.95);}}
];

/* ══════════ 章节机制 ══════════ */
let si=-1,playing=false,acc=0;
function restart(){buildTraj(240);S.k=0;playing=true;}
function gotoStep(i){
  i=clamp(i,0,CH.length-1);
  const ch=CH[i],changed=(si<0)||(CH[si].c!==ch.c);
  si=i;
  $("stepno").textContent=String(i+1).padStart(2,"0")+" / "+String(CH.length).padStart(2,"0");
  $("sttitle").textContent=ch.t;
  $("stbody").innerHTML=ch.b;$("stbody").scrollTop=0;
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i));
  $("prev").disabled=i===0;$("next").disabled=i===CH.length-1;
  if(changed){$("ctrlbody").innerHTML=ch.c;bindCtrl();}
  ch.en();
  $("chart").classList.toggle("show",!!ch.chart);
  restart();syncCtrl();
}
function bindCtrl(){
  const sk=$("sKappa");
  if(sk){
    sk.oninput=()=>{S.kappa=+sk.value;if(S.autoStep)S.s=gdOptS();restart();syncCtrl();};
    $$("[data-kappa]").forEach(b=>b.onclick=()=>{
      S.kappa=+b.dataset.kappa;if(S.autoStep)S.s=gdOptS();restart();syncCtrl();});
  }
  const ss=$("sStep");if(ss)ss.oninput=()=>{S.s=+ss.value;S.autoStep=false;restart();syncCtrl();};
  const sb=$("sBeta");if(sb)sb.oninput=()=>{S.beta=+sb.value;restart();syncCtrl();};
  const bo=$("b_opt");if(bo)bo.onclick=()=>{S.s=gdOptS();S.autoStep=false;restart();syncCtrl();};
  const bh=$("b_hbopt");if(bh)bh.onclick=()=>{
    S.mom=true;S.s=hbOptAlpha()*S.kappa;S.beta=hbOptBeta();restart();syncCtrl();};
  const bg=$("b_gdopt");if(bg)bg.onclick=()=>{
    S.mom=false;S.beta=0;S.s=gdOptS();restart();syncCtrl();};
  const bp=$("b_play");if(bp)bp.onclick=()=>{S.k=0;playing=true;};
}
function say(html,cls){const e=$("verdict");e.innerHTML=html;e.className=cls||"";}
function syncCtrl(){
  const sk=$("sKappa");if(sk)sk.value=S.kappa;
  if($("vKappa"))$("vKappa").textContent=S.kappa.toFixed(0);
  const ss=$("sStep");if(ss){ss.value=S.s;if($("vStep"))$("vStep").textContent=S.s.toFixed(3);}
  const sb=$("sBeta");if(sb){sb.value=S.beta;if($("vBeta"))$("vBeta").textContent=S.beta.toFixed(3);}
  $$("[data-kappa]").forEach(b=>b.classList.toggle("on",+b.dataset.kappa===S.kappa));
  hud();
  const rho=worstRate(),st=stepsTo(.01);
  const big=$("rhoBig");
  if(big)big.textContent=S.mom
    ? `ρ = ${rho.toFixed(4)}　最优 (√κ−1)/(√κ+1) = ${hbOptRho().toFixed(4)}`
    : `ρ = ${rho.toFixed(4)}　最优 (κ−1)/(κ+1) = ${gdOptRho().toFixed(4)}`;
  if(si<=1){
    say(S.kappa<=1.01
      ? "κ = 1：两个方向曲率相同，一步到位。"
      : `κ = ${S.kappa.toFixed(0)}：陡峭方向比平坦方向弯 ${S.kappa.toFixed(0)} 倍。`,
      S.kappa<=1.01?"good":"");
  }else if(rho>=1){
    say(`<b>发散。</b>最坏特征根模长 ${rho.toFixed(3)} ≥ 1${S.mom?`，已越过边界 s &lt; 2(1+β) = ${(2*(1+S.beta)).toFixed(2)}`:""}。误差会被逐步放大。`,"warn");
  }else if(S.mom){
    say(`最坏收缩率 ${rho.toFixed(4)}，降到 1% 需 ${st} 步。最优动量可到 ${hbOptRho().toFixed(4)}。`,"good");
  }else if(Math.abs(S.s-gdOptS())<.02){
    say(`<b>已是最优固定步长。</b>两个方向收缩率都等于 ${gdOptRho().toFixed(4)}，降到 1% 仍需 ${st} 步——这就是上限。`,"good");
  }else{
    say(`最坏收缩率 ${rho.toFixed(4)}，降到 1% 需 ${isFinite(st)?st+" 步":"不收敛"}。理论最优是 ${gdOptRho().toFixed(4)}。`,"");
  }
}

/* ══════════ 缩放 ══════════ */
function camTo(){}
cv.addEventListener("wheel",e=>{e.preventDefault();
  CAM.tdist=clamp(CAM.tdist*(e.deltaY>0?.93:1.07),.45,3);},{passive:false});

/* ══════════ 主循环 ══════════ */
function frame(){
  CAM.dist+=(CAM.tdist-CAM.dist)*.12;
  if(playing&&++acc%3===0){
    S.k++;
    if(S.k>=Math.min(traj.length-1,60))playing=false;
  }
  render();
  if($("chart").classList.contains("show"))drawChart();
  requestAnimationFrame(frame);
}

$("prev").onclick=()=>gotoStep(si-1);
$("next").onclick=()=>gotoStep(si+1);
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft")gotoStep(si-1);
  if(e.key==="ArrowRight")gotoStep(si+1);
});
$$("#switch button").forEach(b=>b.onclick=()=>{
  document.body.className="pm-"+b.dataset.panel;
  $$("#switch button").forEach(x=>x.classList.toggle("on",x===b));
});

/* ══════════ 启动 ══════════ */
$("dots").innerHTML=CH.map(()=>"<i></i>").join("");
$$("#dots i").forEach((d,k)=>d.onclick=()=>gotoStep(k));
document.body.className="pm-story";
$("chCap").textContent="蓝 = 平坦方向的误差，橙 = 陡峭方向的误差。虚线是当前步。";
gotoStep(0);
requestAnimationFrame(frame);
setTimeout(()=>{$("loader").classList.add("hide");
  setTimeout(()=>$("loader").style.display="none",600);},240);

/* ══════════ 自检：逐步执行必须等于闭式解 ══════════ */
window.__optCheck=(()=>{
  const save={k:S.kappa,s:S.s,b:S.beta,m:S.mom};
  let gdErr=0,rhoErr=0,hbErr=0;
  for(const kap of [1.1,2,10,100,1000]){
    S.kappa=kap;S.mom=false;S.beta=0;S.s=gdOptS();
    buildTraj(40);
    const a=alpha();
    gdErr=Math.max(gdErr,
      Math.abs(traj[25][0]-Math.pow(1-a*1,25)*S.x0[0]),
      Math.abs(traj[25][1]-Math.pow(1-a*kap,25)*S.x0[1]));
    rhoErr=Math.max(rhoErr,
      Math.abs(Math.max(Math.abs(1-a),Math.abs(1-a*kap))-gdOptRho()));
    S.mom=true;S.s=hbOptAlpha()*kap;S.beta=hbOptBeta();
    hbErr=Math.max(hbErr,Math.abs(Math.max(rateFor(1),rateFor(kap))-hbOptRho()));
  }
  S.kappa=save.k;S.s=save.s;S.beta=save.b;S.mom=save.m;buildTraj(240);
  return{逐步与闭式最大差:gdErr,最优收缩率误差:rhoErr,动量最坏模长误差:hbErr};
})();
(()=>{const c=window.__optCheck;
  if(c.逐步与闭式最大差>1e-9)console.warn("[opt] 逐步执行与闭式解不符",c);
  if(c.最优收缩率误差>1e-9)console.warn("[opt] 最优收缩率不符",c);
  /* 最优动量参数下判别式恰为 0（双重根），sqrt(disc) 在 ±ε 之间翻分支，
     误差量级自然是 √eps ≈ 1.5e-8，不是实现错误。 */
  if(c.动量最坏模长误差>1e-6)console.warn("[opt] 动量最坏模长不符",c);})();
</script>
