<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可视化作品集</title>
<meta name="description" content="把复杂的东西做成能上手玩的可交互演示。">
<style>
/* 临时落地页 —— 之后会重做。加新作品：在下面的 WORKS 数组里加一条即可。 */
:root{--bg:#0a0e14;--ink:#f2f5fa;--dim:#9aa5bd;--dim2:#616c85;--line:rgba(255,255,255,.10)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;padding:14vh 24px 80px;
  font-family:"PingFang SC","Noto Sans SC",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto}
h1{font-family:"Songti SC","Noto Serif SC",Georgia,serif;font-size:clamp(30px,5vw,46px);
  font-weight:600;letter-spacing:.02em;margin-bottom:14px}
.lead{color:var(--dim);font-size:14.5px;line-height:1.95;max-width:560px;margin-bottom:14px}
.wip{display:inline-block;font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.16em;
  color:var(--dim2);border:1px solid var(--line);border-radius:20px;padding:4px 11px;margin-bottom:46px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
a.card{display:block;text-decoration:none;color:inherit;padding:22px;border-radius:16px;
  background:rgba(255,255,255,.035);border:1px solid var(--line);border-top-width:2px;
  transition:.3s cubic-bezier(.2,.8,.3,1)}
a.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.26)}
.card .tag{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.14em;
  padding:3px 9px;border-radius:20px;display:inline-block;margin-bottom:12px}
.card h2{font-family:"Songti SC",Georgia,serif;font-size:21px;font-weight:600;margin-bottom:8px}
.card p{font-size:13px;line-height:1.8;color:var(--dim)}
.card .go{margin-top:14px;font-family:ui-monospace,monospace;font-size:11px;color:var(--dim2);letter-spacing:.08em}
a.card:hover .go{color:var(--ink)}
footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);
  font-size:12px;color:var(--dim2);line-height:2}
footer a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1>可视化作品集</h1>
  <p class="lead">把复杂的东西做成能上手玩的可交互演示。数学、物理、数据、系统——什么有意思做什么。</p>
  <div class="wip">临时落地页 · 之后重做</div>
  <div class="grid" id="grid"></div>
  <footer>
    源码 <a href="https://github.com/ma2214889041/viz" target="_blank" rel="noopener">github.com/ma2214889041/viz</a>
  </footer>
</div>

<script>
/* ── 加新作品只需在这里加一条，然后建一个同名文件夹放 index.html ── */
const WORKS=[
  {
    dir:'kakeya-boltzmann',
    tag:'数学',
    color:'#58c4dd',
    title:'一根针与一盒气体',
    desc:'两个悬了一百年的问题：一根针转过所有方向最少要占多大地方？一堆只服从牛顿定律的小球，时间方向是从哪来的？'
  }
];

document.getElementById('grid').innerHTML=WORKS.map(w=>`
  <a class="card" href="${w.dir}/" style="border-top-color:${w.color}">
    <span class="tag" style="background:${w.color}22;color:${w.color}">${w.tag}</span>
    <h2>${w.title}</h2>
    <p>${w.desc}</p>
    <div class="go">打开 →</div>
  </a>`).join('');
</script>
</body>
</html>
